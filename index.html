                if (!await give(indices.filter(i => i % 2 === 0))) throw new Error('thumbnails unread');
                const without = track.gone();
                if (without === null) return null;
                const suspect = strip => {
                    if (strip < 0 || strip >= strips.length) return false;
                    for (let i = strip * perStrip; i < (strip + 1) * perStrip; i++) if (without[i]) return true;
                    return false;
                };
                if (!await give(indices.filter(i => i % 2 === 1 && (suspect(i - 1) || suspect(i + 1))))) throw new Error('thumbnails unread');
                return track.breaks(strips[0].time, strips[0].duration / perStrip);
            }

            async function searchRecording(url, name, mine) {
                if (known.has(name)) {
                    recorded = known.get(name);
                    recordedState = 'known';
                    return;
                }
                recordedState = 'searching';
                try {
                    const mpd = new DOMParser().parseFromString(await text(url), 'application/xml').documentElement;
                    const periods = mpd ? children(mpd, 'Period') : [];
                    const total = mpd ? seconds(mpd.getAttribute('mediaPresentationDuration')) : NaN;
                    // One still being made, of no length yet, is searched again once it is whole: what is found is kept.
                    if (mpd && (mpd.getAttribute('type') === 'dynamic' || !(total > 0))) throw new Error('not whole yet');
                    if (!mpd || periods.length !== 1) {
                        if (mine === playing) recordedState = 'not a recording';
                        return;
                    }
                    const base = baseOf(periods[0], baseOf(mpd, url));
                    let captions = null;
                    let logoBreaks = null;
                    for (const set of children(periods[0], 'AdaptationSet')) {
                        const representation = children(set, 'Representation')[0];
                        const mime = set.getAttribute('mimeType') || (representation && representation.getAttribute('mimeType')) || '';
                        const kind = set.getAttribute('contentType') || mime.split('/')[0];
                        if (kind === 'text' && captions === null) {
                            captions = await captionsOf(segmentsOf(set, base, total), mine);
                        } else if (kind === 'image' && logoBreaks === null) {
                            const tiles = children(set, 'EssentialProperty').concat(representation ? children(representation, 'EssentialProperty') : [])
                                .filter(p => /thumbnail_tile$/.test(p.getAttribute('schemeIdUri') || ''))[0];
                            const layout = /^(\d+)x(\d+)$/.exec(tiles ? (tiles.getAttribute('value') || '') : '');
                            if (layout) logoBreaks = await logoOf(segmentsOf(set, base, total), Number(layout[1]), Number(layout[2]), mine);
                        }
                        if (mine !== playing) return;
                    }
                    const breaks = AdRule.combine(captions, logoBreaks).filter(b => b[0] > 0 && b[1] < total);
                    known.set(name, breaks);
                    if (known.size > 20) known.delete(known.keys().next().value);
                    if (mine !== playing) return;
                    recorded = breaks;
                    recordedState = 'found ' + breaks.length + ' (captions ' + (captions === null ? 'none' : captions.length) +
                        ', logo ' + (logoBreaks === null ? 'none' : logoBreaks.length) + ')';
                } catch (e) {
                    // Not remembered: asked again a while later while it plays, less and less often, as the
                    // next time it is loaded.
                    if (mine === playing) {
                        recordedState = 'error: ' + String(e && e.message).slice(0, 40);
                        setTimeout(() => {
                            if (mine === playing && /^error/.test(recordedState)) wanted = { url, name, mine };
                        // No further apart than some two weeks: a timer reads its delay as 32 bits.
                        }, RECORDING_RETRY_MS * 2 ** Math.min(recordingFails++, 12));
                    }
                }
            }

            // The breaks a live manifest marks, in seconds since 1970, which is where its times start.
            async function readMarked(mine) {
                try {
                    const mpd = new DOMParser().parseFromString(await text(manifestUrl), 'application/xml').documentElement;
                    if (!mpd || mine !== playing) return;
                    const zero = Date.parse(mpd.getAttribute('availabilityStartTime') || '') / 1000;
                    if (!isFinite(zero)) {
                        markedState = 'no start time';
                        return;
                    }
                    const periods = children(mpd, 'Period');
                    const starts = periods.map(p => seconds(p.getAttribute('start')));
                    let previous = null;
                    const stretches = periods.map((period, i) => {
                        // A period that does not say where it starts follows the one before.
                        const start = isFinite(starts[i]) ? zero + starts[i] : (previous !== null ? previous : zero);
                        const length = seconds(period.getAttribute('duration'));
                        const end = isFinite(length) ? start + length : (i + 1 < starts.length && isFinite(starts[i + 1]) ? zero + starts[i + 1] : null);
                        const streams = children(period, 'EventStream').filter(s => (s.getAttribute('schemeIdUri') || '').indexOf('urn:scte:scte35') === 0);
                        const marks = [];
                        for (const stream of streams) {
                            const scale = Number(stream.getAttribute('timescale') || 1);
                            const from = Number(stream.getAttribute('presentationTimeOffset') || 0);
                            for (const event of children(stream, 'Event')) {
                                const opens = AdRule.opens(new XMLSerializer().serializeToString(event));
                                if (opens === null) continue;
                                const length_ = Number(event.getAttribute('duration') || 0) / scale;
                                marks.push({ at: start + (Number(event.getAttribute('presentationTime') || 0) - from) / scale, duration: length_ > 0 ? length_ : null, opens });
                            }
                        }
                        previous = end;
                        return { start, end, marks, signalled: streams.length > 0 };
                    });
                    marked = AdRule.markedBreaks(stretches);
                    markedState = 'periods ' + periods.length + ', breaks ' + marked.length;
                    if (separating) videoSegments = videoSegmentsOf(mpd, zero);
                } catch (e) {
                    if (mine === playing) markedState = 'error: ' + String(e && e.message).slice(0, 40);
                }
            }

            // The segments of the video renditions of a live manifest that AdRule.BLACKS lists, the
            // lowest of each height there, as {time (s since 1970), duration, url, height, key}: only
            // from a timeline, whose times are the segments' own.
            function videoSegmentsOf(mpd, zero) {
                const out = [];
                const now = Date.now() / 1000;
                const top = baseOf(mpd, manifestUrl);
                for (const period of children(mpd, 'Period')) {
                    const start = zero + (seconds(period.getAttribute('start')) || 0);
                    // The set and representation read for each height.
                    const chosen = new Map();
                    for (const s of children(period, 'AdaptationSet')) {
                        if (s.getAttribute('contentType') !== 'video' && !/^video\//.test(s.getAttribute('mimeType') || '')) continue;
                        for (const r of children(s, 'Representation')) {
                            const bandwidth = Number(r.getAttribute('bandwidth'));
                            const height = Number(r.getAttribute('height') || s.getAttribute('height'));
                            if (!(bandwidth > 0) || !AdRule.BLACKS[height]) continue;
                            const was = chosen.get(height);
                            if (!was || bandwidth < Number(was.rep.getAttribute('bandwidth'))) chosen.set(height, { set: s, rep: r });
                        }
                    }
                    chosen.forEach((of, height) => {
                        const template = children(of.set, 'SegmentTemplate')[0] || children(of.rep, 'SegmentTemplate')[0];
                        if (!template || !children(template, 'SegmentTimeline')[0]) return;
                        const base = baseOf(of.rep, baseOf(of.set, baseOf(period, top)));
                        for (const segment of segmentsOf(of.set, base, now - start, of.rep)) {
                            const time = start + segment.time;
                            out.push({ time, duration: segment.duration, url: segment.url, height, key: height + ' ' + time });
                        }
                    });
                }
                return out;
            }

            // The first length bytes at url; null when they cannot be had.
            async function head(url, length) {
                const abort = new AbortController();
                const timer = setTimeout(() => abort.abort(), TIMEOUT_MS);
                try {
                    const response = await fetch(url, { credentials: 'omit', headers: { Range: 'bytes=0-' + (length - 1) }, signal: abort.signal });
                    if (!response.ok) return null;
                    const bytes = new Uint8Array(await response.arrayBuffer());
                    // A server that sends all of it, not heeding the range.
                    return bytes.length > length ? bytes.subarray(0, length) : bytes;
                } catch (e) {
                    return null;
                } finally {
                    clearTimeout(timer);
                }
            }

            // Where the blacks in a segment end; null when it cannot be read.
            async function blacksOf(segment) {
                let bytes = await head(segment.url, HEAD_BYTES);
                if (bytes === null) return null;
                const end = AdRule.moofEnd(bytes);
                if (end === null) return null;
                if (end > bytes.length) bytes = await head(segment.url, end);
                if (bytes === null) return null;
                const sizes = AdRule.frameSizes(bytes);
                if (sizes === null || sizes.length === 0) return null;
                return AdRule.separatorEnds(sizes, segment.time, segment.duration / sizes.length, AdRule.BLACKS[segment.height]);
            }

            // The blacks around the playhead (at, with the live point at end, s since 1970), read where
            // not known yet, and the breaks they make. One that cannot be read has none, which ends a
            // break rather than making one, and is asked for again the next times, a few of them.
            async function readSeparators(at, end, mine) {
                const from = at - SEPARATED_FAR_S;
                const to = Math.min(end - SEGMENT_NOT_YET_S, at + SEPARATED_FAR_S);
                const todo = videoSegments.filter(s => s.time + s.duration > from && s.time < to &&
                    (!blacks.has(s.key) || (blackMisses.has(s.key) && blackMisses.get(s.key) < TRIES)));
                const got = await each(todo, 6, blacksOf);
                if (mine !== playing) return;
                todo.forEach((s, i) => {
                    if (got[i] === null) blackMisses.set(s.key, (blackMisses.get(s.key) || 0) + 1);
                    else blackMisses.delete(s.key);
                    blacks.set(s.key, { time: s.time, ends: got[i] || [] });
                });
                // A break longer than the reach keeps its start: what is read stays twice as long.
                for (const k of Array.from(blacks.keys())) {
                    if (blacks.get(k).time >= at - 2 * SEPARATED_FAR_S) continue;
                    blacks.delete(k);
                    blackMisses.delete(k);
                }
                const ends = [];
                for (const read of blacks.values()) for (const e of read.ends) ends.push(e);
                separated = AdRule.separatedBreaks(ends);
                separatorsState = 'segments ' + blacks.size + ', breaks ' + separated.length;
            }

            // What each picture of a live channel has of its logo, read where it is not known yet, for
            // the stream mine: none is asked for once another plays, nor kept.
            async function readPictures(from, to, mine) {
                const wanted = [];
                for (let time = from; time <= to; time += STEP_S) {
                    if (!scores.has(time) || (missed.has(time) && missed.get(time) < TRIES)) wanted.push(time);
                }
                if (wanted.length === 0) return;
                const used = logo;
                const url = thumbnailsUrl;
                const got = await each(wanted, 4, async time => {
                    if (mine !== playing) return null;
                    const data = await pixels(url + '/' + time, PICTURE_WIDTH, PICTURE_HEIGHT);
                    if (data === null) return null;
                    const luma = lumaOf(data, PICTURE_WIDTH, 0);
                    return [AdRule.score(used, luma), used.lower ? AdRule.score(used.lower, luma) : null];
                });
                if (mine !== playing || used !== logo) return;
                wanted.forEach((time, i) => {
                    // One that cannot be had counts as showing the logo, and is asked for again.
                    if (got[i] === null) missed.set(time, (missed.get(time) || 0) + 1);
                    else missed.delete(time);
                    scores.set(time, got[i] === null ? used.usual : got[i][0]);
                    if (used.lower) lowerScores.set(time, got[i] === null ? used.lower.usual : got[i][1]);
                });
            }

            // The pictures of times that can be had, as their luma row by row, for the stream mine.
            async function picturesAt(times, mine) {
                const url = thumbnailsUrl;
                return (await each(times, 4, async time => {
                    if (mine !== playing) return null;
                    const data = await pixels(url + '/' + time, PICTURE_WIDTH, PICTURE_HEIGHT);
                    return data === null ? null : lumaOf(data, PICTURE_WIDTH, 0);
                })).filter(p => p !== null);
            }

            // The logo of pictures, null when none stands out.
            function logoIn(pictures) {
                if (pictures.length === 0) return null;
                const track = AdRule.track(pictures.length, PICTURE_WIDTH, PICTURE_HEIGHT);
                pictures.forEach((picture, i) => track.add(i, picture));
                return track.logo();
            }

            async function learn(at, last, mine) {
                const times = [];
                for (let time = at - LEARN_SPAN_S; time <= Math.min(last, at + LEARN_SPAN_S); time += LEARN_EVERY_S) times.push(time);
                // Nothing changes until the pictures are in, and the earlier ones looked at where needed.
                const pictures = await picturesAt(times, mine);
                // Another stream was loaded meanwhile: what was learnt is not its logo.
                if (mine !== playing) return;
                // None could be had, as when the connection is lost for a moment: what was learnt before
                // stays, and the learn is tried again as when it finds nothing.
                if (pictures.length === 0) {
                    again(at);
                    return;
                }
                const own = logoIn(pictures);
                if (own !== null && own.channel) remembered.set(thumbnailsUrl, AdRule.alone(own));
                // Where no logo stands out, as when most of the pictures are of adverts and trailers, the
                // channel's from before, when seen on enough of them: the last found, or else one looked
                // for in the earlier pictures, once a stream. One learnt over another programme can fit
                // these pictures too poorly: the top left corner of M6's teleshopping holds its own logo.
                let kept = null;
                if (own === null) {
                    const known = remembered.get(thumbnailsUrl);
                    if (known && AdRule.seenIn(known, pictures, KEPT_SEEN)) {
                        kept = known;
                    } else if (searchedFor !== thumbnailsUrl) {
                        const back = await earlier(at, mine);
                        if (mine !== playing) return;
                        if (back !== null) {
                            remembered.set(thumbnailsUrl, back);
                            if (AdRule.seenIn(back, pictures, KEPT_SEEN)) kept = back;
                        }
                    }
                }
                learntAt = at;
                logo = kept || own;
                scores = new Map();
                lowerScores = new Map();
                missed = new Map();
                logoState = logo === null ? 'none in ' + pictures.length + ' pictures'
                    : 'strength ' + Math.round(logo.strength) + (logo.lower ? ', lower one ' + Math.round(logo.lower.strength) : '') + (kept !== null ? ', kept' : '');
                // Nothing learnt: tried again a little further on, then less and less often, as each try
                // fetches all its pictures again.
                if (logo === null) again(at);
                else failures = 0;
            }

            // Nothing learnt at at: the next learn, further on as more fail in a row.
            function again(at) {
                learntAt = at - LEARN_AGAIN_S + Math.min(LEARN_AGAIN_S, LEARN_RETRY_S * 2 ** failures);
                if (LEARN_RETRY_S * 2 ** failures < LEARN_AGAIN_S) failures++;
            }

            // The channel's logo as the pictures before those around at show it, forty minutes of them
            // at a time, the nearest first, up to EARLIER_TIMES of them: for a channel opened in the
            // middle of a long block of adverts and trailers, where its logo is faint and stands out
            // only where the programme fills most of the pictures. Null when it stands out in none.
            async function earlier(at, mine) {
                let seen = null;
                for (let back = 0; back < EARLIER_TIMES; back++) {
                    const end = at - LEARN_SPAN_S - back * 2 * LEARN_SPAN_S;
                    const times = [];
                    for (let time = end - 2 * LEARN_SPAN_S; time < end; time += LEARN_EVERY_S) times.push(time);
                    const pictures = await picturesAt(times, mine);
                    if (mine !== playing) return null;
                    // None of the nearest could be had, as when the connection is lost: looked for again at
                    // the next learn. None further on: older than the service keeps them, as are those before.
                    if (pictures.length === 0) {
                        if (back === 0) return null;
                        break;
                    }
                    const got = logoIn(pictures);
                    if (got !== null && got.channel) {
                        seen = AdRule.alone(got);
                        break;
                    }
                }
                // Only once searched to the end.
                searchedFor = thumbnailsUrl;
                return seen;
            }

            // The pictures read, without a gap, around at: the time of the first, and whether each
            // is without the logo.
            function knownAround(at) {
                let first = at;
                while (scores.has(first - STEP_S)) first -= STEP_S;
                const score = [];
                const lower = [];
                for (let time = first; scores.has(time); time += STEP_S) {
                    score.push(scores.get(time));
                    if (logo.lower) lower.push(lowerScores.has(time) ? lowerScores.get(time) : logo.lower.usual);
                }
                const all = score.map(() => true);
                return {
                    first,
                    gone: AdRule.gone(score, logo.usual, all),
                    lowerGone: logo.lower ? AdRule.gone(lower, logo.lower.usual, all) : null,
                };
            }

            // The breaks the logo gives away around the playhead, at seconds since 1970 with the
            // live point at liveAt.
            async function lookForLogo(atSeconds, liveAt, mine) {
                const at = Math.floor(atSeconds / STEP_S) * STEP_S;
                const last = Math.floor((liveAt - NOT_YET_S) / STEP_S) * STEP_S;
                if (at > last) return;
                // Not learnt again in a break: all that is known of it would be read again with the new
                // logo, and the break be lost the while. Once out of it, as late as a break may last.
                const since = Math.abs(at - learntAt);
                const held = found.some(b => b[0] <= at && at <= b[1]) && since <= LEARN_AGAIN_S + AdRule.LOGO_MAX_S;
                if (since > LEARN_AGAIN_S && !held) await learn(at, last, mine);
                if (logo === null || mine !== playing) return;
                await readPictures(at - BACK_S, Math.min(last, at + AHEAD_S), mine);
                for (let more = 0; more < MORE_TIMES; more++) {
                    if (mine !== playing || !scores.has(at)) return;
                    const around = knownAround(at);
                    const count = around.gone.length;
                    const until = around.first + count * STEP_S;
                    // The show's logo is followed too: adverts can keep the channel's seen through half a
                    // break (see AdRule.logoBreaks), which the show's alone then gives.
                    const stretches = AdRule.runs(AdRule.solid(around.gone), AdRule.BRIDGE)
                        .concat(around.lowerGone ? AdRule.runs(AdRule.solid(around.lowerGone), AdRule.BRIDGE) : []);
                    const open = stretches.some(r => r[1] + AdRule.AROUND >= count && (count - r[0]) * STEP_S <= FAR_S);
                    // Back only for the break the playhead is in: one over before it has nothing to skip.
                    const here = (at - around.first) / STEP_S;
                    const begun = stretches.some(r => r[0] < AdRule.AROUND && r[1] >= here && (r[1] + 1) * STEP_S <= FAR_S);
                    if (open && until <= last) await readPictures(until, Math.min(last, until + MORE_S), mine);
                    else if (begun && around.first > at - FAR_S) await readPictures(around.first - MORE_S, around.first - STEP_S, mine);
                    else break;
                }
                if (mine !== playing || logo === null || !scores.has(at)) return;
                const around = knownAround(at);
                found = AdRule.logoBreaks(around.gone, around.first, STEP_S, around.lowerGone);
                for (const time of Array.from(scores.keys())) if (time < at - KEPT_S) scores.delete(time);
                for (const time of Array.from(lowerScores.keys())) if (time < at - KEPT_S) lowerScores.delete(time);
                for (const time of Array.from(missed.keys())) if (time < at - KEPT_S) missed.delete(time);
            }

            // Where playback is, and the live point, in seconds since 1970; null when it cannot be told.
            function liveTimes() {
                const range = env.liveRange();
                const now = env.currentTime();
                if (!range || typeof now !== 'number' || !isFinite(now) || !isFinite(range.end)) return null;
                const at = env.absoluteTime(now);
                const end = env.absoluteTime(range.end);
                // Not a time of day, as when the stream gives none: within the day, or nothing.
                const wall = Date.now() / 1000;
                if (typeof at !== 'number' || typeof end !== 'number' || !(at > wall - 86400 && at < wall + 600) || !(end >= at)) return null;
                return { at, end };
            }

            async function lookLive(mine) {
                if (looking === mine) return;
                looking = mine;
                try {
                    const times = liveTimes();
                    // Only behind the live point: at it there is nowhere to skip to.
                    if (times === null || times.end - times.at <= BEHIND_S) return;
                    if (Date.now() - markedAt >= MARKED_EVERY_MS && manifestUrl) {
                        markedAt = Date.now();
                        await readMarked(mine);
                    }
                    if (separating && mine === playing) await readSeparators(times.at, times.end, mine);
                    if (thumbnailsUrl !== null && mine === playing) await lookForLogo(times.at, times.end, mine);
                } catch (e) {
                    logoState = 'error: ' + String(e && e.message).slice(0, 40);
                } finally {
                    if (looking === mine) looking = 0;
                }
            }

            // Once a second: the break playback is in, if any, is offered with the pill.
            function tick() {
                let end = null;
                try {
                    const state = env.state();
                    if (key !== null && (state === 'playing' || state === 'paused')) {
                        const now = env.currentTime();
                        if (wanted !== null && state === 'playing') {
                            const search = wanted;
                            wanted = null;
                            if (search.mine === playing) searchRecording(search.url, search.name, search.mine);
                        }
                        const early = b => [b[0], b[1] - GUESS_EARLY_S];
                        if (!live) {
                            const inside = recorded.map(early).filter(b => now >= b[0] && now < b[1] - LAST_MOMENT_S)[0];
                            if (inside) end = inside[1];
                        } else if (!env.joining()) {
                            // Not while the stream is still joining the live point: it stands at the start
                            // of its window then, which is no place it is watched from.
                            const times = liveTimes();
                            if (times !== null) {
                                // What the manifest marks is exact, and comes first; then the blacks between
                                // adverts, whose ends are in them; then what the logo finds, to the end of
                                // those blacks when it runs into them.
                                const here = b => times.at >= b[0] && times.at < b[1] - LAST_MOMENT_S && b[1] <= times.end - LIVE_MARGIN_S;
                                const inside = marked.filter(here)[0] || separated.filter(here)[0] || found.map(early).map(b => AdRule.reachSeparated(b, separated)).filter(here)[0];
                                if (inside) {
                                    const target = env.mediaTime(inside[1]);
                                    if (typeof target === 'number' && isFinite(target) && target > now) end = target;
                                }
                            }
                            if (Date.now() - lookedAt >= LOOK_EVERY_MS) {
                                lookedAt = Date.now();
                                lookLive(playing);
                            }
                        }
                    }
                } catch (e) {
                    end = null;
                }
                offered = end;
                shown = env.show(offered !== null);
            }

            // OK was pressed with the pill up: true when the break was skipped.
            function skip() {
                if (offered === null || !shown) return false;
                const target = offered;
                offered = null;
                shown = env.show(false);
                env.seek(target);
                return true;
            }

            // What the search is at, for the status: no address, no credential. With where the skip on
            // offer leads (skip_to, media time), for a sender to offer it too.
            function report() {
                const out = { live, offered: offered !== null, skip_to: offered };
                if (live) {
                    out.marked = markedState;
                    out.logo = thumbnailsUrl === null ? 'no pictures' : logoState;
                    out.found = found.length;
                    if (separating) out.separators = separatorsState;
                    try {
                        const times = liveTimes();
                        out.clock = times === null ? 'none' : Math.round(Date.now() / 1000 - times.end) + ' s behind at the live point';
                    } catch (e) {
                        out.clock = 'error';
                    }
                } else {
                    out.recording = recordedState;
                    out.breaks = recorded.map(b => [Math.round(b[0]), Math.round(b[1])]);
                }
                return out;
            }

            return { load, tick, skip, report };
        }
        // </ad-skip>

        const skipPill = document.getElementById('skip-pill');
        // Whether a skip was offered at the last look, for the senders to be told when that changes.
        let skipOffered = false;
        const adSkip = makeAdSkip({
            isLive: () => streamIsLive,
            joining: () => liveJoinPending,
            state: () => {
                const state = playerManager.getPlayerState();
                const states = cast.framework.messages.PlayerState;
                return state === states.PLAYING ? 'playing' : state === states.PAUSED ? 'paused' : 'other';
            },
            currentTime: () => playerManager.getCurrentTimeSec(),
            liveRange: () => playerManager.getLiveSeekableRange(),
            absoluteTime: media => playerManager.getAbsoluteTimeForMediaTime(media),
            mediaTime: absolute => playerManager.getMediaTimeForAbsoluteTime(absolute),
            // Not over a menu, which the pill would hide.
            show: on => {
                const visible = !!skipPill && on && !menuVisible && !trackMenuVisible;
                if (skipPill) skipPill.classList.toggle('visible', visible);
                // A status goes out on player events only: the senders are told when a break begins or
                // ends, for one that offers the skip too (see report).
                if (on !== skipOffered) {
                    skipOffered = on;
                    try {
                        playerManager.broadcastStatus(false);
                    } catch (e) {
                        // The status follows with the next player event.
                    }
                }
                return visible;
            },
            seek: media => {
                // A seek being stepped with the arrows would land after this one, back in the adverts.
                cancelPendingSeek();
                clampedSeek(media);
            },
        });

        // Key Event Handling
        // Cast remotes dispatch KeyboardEvent.key ('ArrowLeft', 'BrowserBack',
        // ...); older webviews only populate the legacy keyCode. Accept both.
        function normalizeKey(event) {
            switch (event.key) {
                case 'ArrowUp': return 'up';
                case 'ArrowDown': return 'down';
                case 'ArrowLeft': return 'left';
                case 'ArrowRight': return 'right';
                case 'Enter': return 'enter';
                case 'MediaPlayPause':
                case 'MediaPlay':
                case 'MediaPause':
                case 'Pause':
                case 'Play':
                    return 'playpause';
                case 'Back':
                case 'BrowserBack':
                case 'GoBack':
                case 'Escape':
                    return 'back';
            }
            switch (event.keyCode) {
                case 38: return 'up';
                case 40: return 'down';
                case 37: return 'left';
                case 39: return 'right';
                case 13: return 'enter';
                case 19:   // Pause
                case 85:   // media play/pause
                case 126:  // media play
                case 127:  // media pause
                case 179:  // media play/pause (some webviews)
                    return 'playpause';
                case 8:
                case 27:
                    return 'back';
            }
            return null;
        }

        function handleKeyDown(event) {
            const action = normalizeKey(event);
            if (!action) return;
            // A key held down repeats: fine for moving about, not for what acts. OK held would open the
            // menu and run its first entry again and again, Back held close the menu then end the cast.
            if (event.repeat && (action === 'enter' || action === 'back' || action === 'playpause')) {
                event.preventDefault();
                return;
            }

            switch (action) {
                case 'down':
                    if (!menuVisible) {
                        flushPendingSeek();
                        showMenu();
                    } else if (trackMenuVisible) {
                        navigateTrackMenu(1);
                    }
                    event.preventDefault();
                    break;

                case 'up':
                    if (trackMenuVisible) {
                        navigateTrackMenu(-1);
                    } else if (menuVisible) {
                        hideMenu();
                    }
                    event.preventDefault();
                    break;

                case 'left':
                    if (menuVisible && !trackMenuVisible) {
                        navigateMenu(-1);
                    } else if (!menuVisible) {
                        stepSeek(SEEK_STEP_BACK, event.repeat);
                    }
                    event.preventDefault();
                    break;

                case 'right':
                    if (menuVisible && !trackMenuVisible) {
                        navigateMenu(1);
                    } else if (!menuVisible) {
                        stepSeek(SEEK_STEP_FWD, event.repeat);
                    }
                    event.preventDefault();
                    break;

                case 'enter':
                    if (menuVisible) {
                        activateMenuItem();
                    } else if (adSkip.skip()) {
                        // The ad break on offer was skipped: OK was for that, not for the menu.
                    } else {
                        flushPendingSeek();
                        showMenu();
                    }
                    event.preventDefault();
                    break;

                case 'playpause':
                    togglePlayPause();
                    event.preventDefault();
                    break;

                case 'back':
                    if (trackMenuVisible) {
                        hideTrackMenu();
                        event.preventDefault();
                    } else if (menuVisible) {
                        hideMenu();
                        event.preventDefault();
                    } else {
                        // No menu open: back/exit ends the cast instead of being swallowed.
                        stopCasting();
                        event.preventDefault();
                    }
                    break;
            }
        }

        document.addEventListener('keydown', handleKeyDown);

        // Track Selection Logic
        // Re-select the user's chosen audio track after a reload (auto-reconnect).
        // Matches by trackId first, then by language, so a track with no language
        // code is still restored and same-language duplicates are not confused.
        function reapplyUserAudio() {
            const audioTracksLocal = tracksOfType('AUDIO');
            if (audioTracksLocal.length === 0) return;
            const activeIds = activeTrackIdsOfType('AUDIO');
            let target = (userAudioTrackId !== null && userAudioTrackId !== undefined)
                ? audioTracksLocal.find(t => t.trackId === userAudioTrackId)
                : null;
            if (!target && userAudioLanguage) {
                target = audioTracksLocal.find(t => t.language === userAudioLanguage);
            }
            if (target && !activeIds.includes(target.trackId)) {
                setActiveTrackOfType('AUDIO', target.trackId);
            }
        }

        // The same for the subtitles chosen, or turned off, which a reload starts without again.
        function reapplyUserText() {
            if (!userSelectedText) return;
            const textTracks = tracksOfType('TEXT');
            const activeIds = activeTrackIdsOfType('TEXT');
            if (userTextTrackId === null || userTextTrackId === undefined) {
                if (textTracks.some(t => activeIds.includes(t.trackId))) setActiveTrackOfType('TEXT', null);
                return;
            }
            let target = textTracks.find(t => t.trackId === userTextTrackId);
            if (!target && userTextLanguage) target = textTracks.find(t => t.language === userTextLanguage);
            if (target && !activeIds.includes(target.trackId)) setActiveTrackOfType('TEXT', target.trackId);
        }

        function forceFrenchAudio() {
            // Respect a manual audio choice instead of forcing French back on. After
            // an auto-reconnect the chosen track must be re-applied, since the reload
            // starts the stream from its default audio again.
            if (userSelectedAudio) {
                reapplyUserAudio();
                return;
            }

            const audioTracksLocal = tracksOfType('AUDIO');
            if (audioTracksLocal.length === 0) return;
            const activeIds = activeTrackIdsOfType('AUDIO');

            // 1. Check for explicit preference from Molotov API (passed via customData)
            const mediaInfo = playerManager.getMediaInformation();
            const customData = mediaInfo ? mediaInfo.customData : null;

            if (customData && customData.selected_track && customData.selected_track.track_audio) {
                const prefLang = customData.selected_track.track_audio;
                const prefTrack = audioTracksLocal.find(
                    t => canonicalLang(t.language) === canonicalLang(prefLang));
                if (prefTrack) {
                    if (!activeIds.includes(prefTrack.trackId)) {
                        console.log("[Etincelle] Switching to API preference:", prefLang);
                        setActiveTrackOfType('AUDIO', prefTrack.trackId);
                    }
                    return;
                }
            }

            // 2. Fallback: If current track is English/Original, look for French
            const activeTrack = audioTracksLocal.find(t => activeIds.includes(t.trackId));
            const activeLang = activeTrack ? activeTrack.language : 'unknown';

            if (activeLang === 'en' || activeLang === 'eng' || activeLang === 'qaa' || activeLang === 'unknown') {
                const target = audioTracksLocal.find(t =>
                    t.language === 'fr' ||
                    t.language === 'fra' ||
                    t.language === 'fre' ||
                    (t.name && t.name.toLowerCase().includes('franç'))
                ) || audioTracksLocal.find(t => t.language !== 'en' && t.language !== 'eng' && t.language !== 'qaa');

                if (target && !activeIds.includes(target.trackId)) {
                    console.log("[Etincelle] Fallback switch to:", target.language);
                    setActiveTrackOfType('AUDIO', target.trackId);
                }
            }
        }

        // Reload the last stream after a failure, doubling the delay between
        // attempts up to a cap so a broken backend is not hammered. It keeps
        // retrying, so the receiver heals itself once the network or backend
        // recovers. The recovering guard stops a burst of errors from stacking
        // several reloads on top of each other.
        function triggerReconnect() {
            // A direct trigger (or the grace-period fallback firing) supersedes any pending fallback.
            clearTimeout(reconnectFallbackTimer);
            reconnectFallbackTimer = null;
            if (!lastLoadRequest || recovering || userStopped) return;

            // Give up once the cached credentials are clearly dead instead of
            // looping forever. Recovery resets the counter (recoveryDone), so the
            // cap only trips after this many failures with no playback in between.
            // The session can only resume with a fresh cast, which carries new
            // credentials, so say so rather than hiding a transient notice.
            if (reconnectAttempts >= RECONNECT_MAX_ATTEMPTS) {
                console.warn('[Etincelle] Giving up after',
                    reconnectAttempts, 'reconnect attempts');
                showNotice('Connexion perdue. Relancez la diffusion.', true, true);
                return;
            }

            recovering = true;

            // Resume a VOD where playback was instead of restarting from the
            // cached request, whose currentTime is only the cast-time start
            // offset (0 for most senders), not the current position. Prefer the
            // freshest clock sample but fall back to the last position seen while
            // playing, since a torn-down error state reports 0 here and would
            // otherwise reload from the beginning. Live is left untouched so it
            // rejoins the edge. streamIsLive is used instead of
            // getMediaInformation(), which can be null mid-recovery.
            if (!streamIsLive) {
                const pos = playerManager.getCurrentTimeSec();
                if (Number.isFinite(pos) && pos > 0) lastKnownPos = pos;
                if (lastKnownPos > 0) lastLoadRequest.currentTime = lastKnownPos;
            } else if (!liveJoinPending && lastLoadRequest.media && lastLoadRequest.media.customData) {
                // A live stream comes back as far behind the live point as it was being watched, or
                // at it: the rewind the cast was started with is stale after a seek, a return to the
                // live point or a pause, and would send the viewer somewhere else.
                // A stream in pause stands still while the live point moves on: where it stands now.
                if (playerManager.getPlayerState() === cast.framework.messages.PlayerState.PAUSED) noteLiveBehind();
                if (liveBehindSec !== null) {
                    reloadLiveRewindSec = liveBehindSec > LIVE_POINT_SEC ? Math.round(liveBehindSec) : 0;
                    lastLoadRequest.media.customData.live_rewind_sec = reloadLiveRewindSec;
                }
            }

            const delay = Math.min(
                RECONNECT_MAX_DELAY,
                RECONNECT_BASE_DELAY * Math.pow(2, reconnectAttempts)
            );
            reconnectAttempts++;
            showNotice('Connexion perdue, reconnexion...', false, true);
            reconnectTimer = setTimeout(() => {
                console.log('[Etincelle] Reconnect attempt', reconnectAttempts);
                // Fail the attempt if load() never settles, so a hung load cannot
                // freeze recovery. settled lets the first of {success, failure,
                // timeout} win and ignores the laggards.
                const gen = reconnectGeneration;
                let settled = false;
                const settle = (failed, reason) => {
                    // Drop this settle if a fresh cast already superseded the reload (recoveryDone bumps
                    // the generation), so an aborted stale load cannot re-arm reconnect over good playback.
                    if (settled || gen !== reconnectGeneration) return;
                    settled = true;
                    clearTimeout(loadGuardTimer);
                    loadGuardTimer = null;
                    recovering = false;
                    if (failed) {
                        console.error('[Etincelle] Reconnect failed:', reason);
                        triggerReconnect();
                    }
                };
                loadGuardTimer = setTimeout(
                    () => settle(true, 'load timed out'), RECONNECT_LOAD_TIMEOUT);
                playerManager.load(lastLoadRequest)
                    .then(() => settle(false))
                    .catch(e => settle(true, e));
            }, delay);
        }

        // Playback resumed, so clear the backoff for the next failure and drop
        // any recovery notice still on screen (including the terminal one, so a
        // fresh cast that succeeds wipes it). Also drop a pending load guard so it
        // cannot fail a reload that has actually succeeded.
        function recoveryDone() {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
            clearTimeout(loadGuardTimer);
            loadGuardTimer = null;
            clearTimeout(reconnectFallbackTimer);
            reconnectFallbackTimer = null;
            reconnectGeneration++;
            reconnectAttempts = 0;
            recovering = false;
            // Its own notices only: playback getting going again after a seek must not wipe what was
            // just said about that seek.
            if (noticeOfRecovery) hideNotice();
        }

        // A user-initiated stop or exit (remote STOP command, or back/exit with no menu open) must end
        // casting, not heal back into playback: flag it so the self-reconnect stays disabled, drop any
        // pending reconnect, then shut the receiver down so the cast session ends on the sender too.
        function stopCasting() {
            userStopped = true;
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
            clearTimeout(reconnectFallbackTimer);
            reconnectFallbackTimer = null;
            stopPlayhead();
            context.stop();
        }

        // Continue-watching playhead reporting. lastOffset is in seconds; the backend rejects 0 and
        // there is no point resending the same second. Fire-and-forget; the backend allows CORS for
        // this origin, so a failed preflight or post must never affect playback.
        function reportPlayhead(offsetSec, force) {
            if (!playheadUrl || !Number.isFinite(offsetSec) || offsetSec <= 0) return;
            // In the credits the episode counts as watched, as the official app reports it, so
            // that continue watching does not offer it again a minute from its end.
            if (playheadCreditsSec > 0 && playheadDurationSec > 0 && offsetSec >= playheadCreditsSec) {
                offsetSec = playheadDurationSec;
            }
            if (!force && offsetSec === playheadLastSent) return;
            // Skip a periodic report while a previous POST is still in flight, so a slow
            // backend cannot pile up overlapping requests. The terminal write passes
            // force to bypass both the de-dup and this guard.
            if (!force && playheadInflight) return;
            playheadLastSent = offsetSec;
            playheadInflight = true;
            const body = Object.assign({}, playheadPayload, { lastOffset: offsetSec });
            // Abort a hung POST before the next tick so a stuck socket is not leaked.
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), PLAYHEAD_INTERVAL - 1000);
            fetch(playheadUrl, {
                method: 'POST', headers: playheadHeaders,
                body: JSON.stringify(body), signal: controller.signal
            })
                .catch(e => console.warn('[Etincelle] playhead post failed', e))
                .finally(() => { clearTimeout(timer); playheadInflight = false; });
        }

        function stopPlayhead() {
            if (playheadTimer) {
                clearInterval(playheadTimer);
                playheadTimer = null;
            }
        }

        // An https address on one of the service's own hosts.
        function isServiceUrl(url) {
            try {
                const u = new URL(url);
                const host = u.hostname.toLowerCase();
                return u.protocol === 'https:' && ['fubo.tv', 'molotov.tv'].some(
                    (domain) => host === domain || host.endsWith('.' + domain));
            } catch (e) {
                return false;
            }
        }

        // Arm reporting from the LOAD customData. Needs the playhead url, its payload template and an
        // access token; without any of them it stays disabled. credits_sec, when given, is where the
        // episode's credits start.
        function setupPlayhead(customData) {
            stopPlayhead();
            playheadUrl = customData.playhead_url || null;
            // Only to the service itself: each report carries the account's token.
            if (playheadUrl && !isServiceUrl(playheadUrl)) playheadUrl = null;
            playheadPayload = customData.playhead_payload || null;
            const token = customData.access_token;
            if (!playheadUrl || !playheadPayload || !token) {
                playheadUrl = null;
                return;
            }
            playheadHeaders = {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json',
                'X-Application-Id': 'molotov',
                'X-Client-Version': '5.51.0',
                'X-Os': 'android',
                'X-Preferred-Language': 'fr-FR'
            };
            if (customData.profile_id) playheadHeaders['X-Profile-Id'] = customData.profile_id;
            if (customData.user_id) playheadHeaders['X-User-Id'] = customData.user_id;
            playheadDurationSec = Math.floor(Number(playheadPayload.duration) || 0);
            const credits = Math.floor(Number(customData.credits_sec));
            playheadCreditsSec = credits > 0 ? credits : 0;
            playheadLastSent = -1;
            playheadTimer = setInterval(() => {
                if (playerManager.getPlayerState() === cast.framework.messages.PlayerState.PLAYING) {
                    reportPlayhead(Math.floor(playerManager.getCurrentTimeSec()));
                }
            }, PLAYHEAD_INTERVAL);
        }

        // Event Listeners
        playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
            forceFrenchAudio();
            // Once per load, not at each change of the tracks: a choice made from a phone since must stand.
            reapplyUserText();
            applyPendingRewind();
            // Show the hint briefly, but only on the first load of the session.
            if (!hintShown) {
                hintShown = true;
                menuHint.classList.add('visible');
                clearTimeout(hideHintTimer);
                hideHintTimer = setTimeout(() => {
                    menuHint.classList.remove('visible');
                }, 5000);
            }
        });

        // Handle tracks appearing late
        playerManager.addEventListener(cast.framework.events.EventType.TRACKS_CHANGED, forceFrenchAudio);

        // A failure should not leave a black screen. Surface it and reload,
        // except when the error is just our own reload aborting the old load.
        playerManager.addEventListener(cast.framework.events.EventType.ERROR, event => {
            const code = event ? event.detailedErrorCode : null;
            console.error('[Etincelle] Playback error:', code, event);
            if (code === cast.framework.events.DetailedErrorCode.LOAD_INTERRUPTED) return;
            // Reloading our cached stream/DRM token cannot recover an expired-credential failure (we
            // cannot refresh it here). Give the phone a brief window to re-resolve fresh credentials
            // and re-cast - a fresh LOAD cancels this via recoveryDone - and self-reconnect only as a
            // fallback if none arrives.
            if (recovering || userStopped || reconnectFallbackTimer !== null) return;
            showNotice('Connexion perdue, reconnexion...', false, true);
            const clockAtError = playerManager.getCurrentTimeSec();
            reconnectFallbackTimer = setTimeout(() => {
                reconnectFallbackTimer = null;
                // An error the stream plays on through (a request of a sender refused, an image that
                // did not load) is no lost stream, and nothing would then say that playback is back:
                // reloading would cut it, with an address and a token that may be stale by now.
                const clock = playerManager.getCurrentTimeSec();
                const playsOn = playerManager.getPlayerState() === cast.framework.messages.PlayerState.PLAYING
                    && Number.isFinite(clock) && clock !== clockAtError;
                if (playsOn) {
                    if (noticeOfRecovery) hideNotice();
                    return;
                }
                triggerReconnect();
            }, RESOLVE_GRACE_MS);
        });

        // Clear the backoff once playback is actually running again.
        playerManager.addEventListener(cast.framework.events.EventType.PLAYING, recoveryDone);
        playerManager.addEventListener(cast.framework.events.EventType.PLAYING, () => { playedSinceLoad = true; });

        // When the item plays through to the end on the TV, mark it watched on the server.
        playerManager.addEventListener(cast.framework.events.EventType.MEDIA_FINISHED, event => {
            const reason = event && event.endedReason;
            const reasons = cast.framework.events.EndedReason;
            if (reason === reasons.END_OF_STREAM) {
                // Prefer the template duration, fall back to the player's duration, then
                // to the last reported position, so this terminal write still carries a
                // positive offset when no duration is known. Bypass the de-dup so an
                // identical last tick cannot drop it.
                const playerDur = Math.floor(playerManager.getDurationSec() || 0);
                const dur = playheadDurationSec > 0 ? playheadDurationSec
                    : (playerDur > 0 ? playerDur : Math.max(0, playheadLastSent));
                reportPlayhead(dur, true);
            } else if (reason === reasons.STOPPED) {
                // Playback was stopped (a STOP from the remote or a sender), as opposed to interrupted
                // by a new load: end casting rather than letting the self-reconnect restart it. This is
                // the reliable catch whichever way the remote's stop reaches the receiver.
                stopCasting();
            }
            // Do not stop the timer here: it self-gates on PLAYING, so a replay/restart in the same
            // session resumes reporting without a fresh LOAD. It is cleared on the next LOAD or as the
            // receiver shuts down.
        });

        // Stop the playhead timer when the receiver shuts down. Not when a sender disconnects: that
        // is said for each one, the phone that cast as it loses its Wi-Fi for a moment included, and
        // what plays goes on without it. Only a LOAD starts the timer again, so the resume point would
        // stay where it was for the rest of the programme.
        context.addEventListener(cast.framework.system.EventType.SHUTDOWN, stopPlayhead);

        // Refresh the live programme bar while it is on screen during a seek; it self-gates off otherwise.
        setInterval(updateProgramBar, 1000);

        // Offer the ad break playback is in, if any.
        setInterval(adSkip.tick, 1000);

        // Reload if the media clock freezes while playback should be advancing.
        setInterval(() => {
            // Also stand down while the post-error grace is pending, so the stall path does not pre-empt
            // the phone's re-resolve with a stale-token reload.
            if (recovering || reconnectFallbackTimer !== null) {
                stalledFor = 0;
                return;
            }
            const messages = cast.framework.messages;
            const state = playerManager.getPlayerState();
            if (state !== messages.PlayerState.PLAYING
                && state !== messages.PlayerState.BUFFERING) {
                stalledFor = 0;
                return;
            }
            const t = playerManager.getCurrentTimeSec();
            // Remember the position while playing so a reconnect can resume here
            // even if the clock is gone by then. Live rejoins the edge instead.
            if (!streamIsLive && Number.isFinite(t) && t > 0) lastKnownPos = t;
            // Any change in the media clock, forward or a backward seek, means
            // playback is not frozen. Only an unchanged clock is a real stall;
            // tracking the max instead would count a rewind as a stall.
            if (Number.isFinite(t) && t !== lastMediaTime) {
                lastMediaTime = t;
                stalledFor = 0;
                // Only while the clock moves: a stream that has frozen falls behind the live point
                // by the length of its stall, which is not a rewind to come back to. Nor while the
                // rewind asked for at the cast is still to be applied: the stream then plays at the
                // live point for a moment, which is not where it is watched.
                if (streamIsLive && !liveJoinPending) noteLiveBehind();
                return;
            }
            stalledFor += STALL_CHECK_INTERVAL;
            // A stream that has not played yet is given longer: its licence alone can take ten seconds
            // or more, and a reload then starts that over, each attempt back at the window's start.
            if (stalledFor >= (playedSinceLoad ? STALL_TIMEOUT : STARTUP_STALL_TIMEOUT)) {
                console.warn('[Etincelle] Playback stalled; reloading');
                stalledFor = 0;
                triggerReconnect();
            }
        }, STALL_CHECK_INTERVAL);

        // Message Interceptors
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            loadRequestData => {
                // A malformed LOAD without media would throw below; hand it back
                // untouched (CAF rejects it) rather than aborting in the interceptor.
                if (!loadRequestData || !loadRequestData.media) return loadRequestData;
                // A new stream is loading; drop any pending seek so a stale
                // target cannot seek the incoming stream.
                cancelPendingSeek();
                // An auto-reconnect reloads the cached request, so it is the
                // same object reference; a genuine new cast is a fresh object.
                // Keep the manual audio choice across a reconnect, drop it for a
                // new stream so French is auto-selected again.
                const isReconnect = (loadRequestData === lastLoadRequest);
                if (!isReconnect) {
                    userSelectedAudio = false;
                    userAudioLanguage = null;
                    userAudioTrackId = null;
                    userSelectedText = false;
                    userTextLanguage = null;
                    userTextTrackId = null;
                    // A genuine new cast re-enables the self-reconnect after an earlier user stop.
                    userStopped = false;
                    // Drop any recovery still pending for the previous stream: cancel its
                    // armed reload (which would otherwise interrupt this new stream) and
                    // reset the backoff so this cast retries from the base delay.
                    recoveryDone();
                    // Drop the previous stream's resume position so a new cast
                    // does not inherit it.
                    lastKnownPos = 0;
                    liveBehindSec = null;
                }
                // Reset the stall watchdog for the new stream.
                lastMediaTime = -1;
                stalledFor = 0;

                const media = loadRequestData.media;
                // Keep the credentials here and out of what the status shows (see SECRET_KEYS). A
                // reconnect reloads the request already stripped, and plays with the ones kept.
                if (!isReconnect) heldSecrets = {};
                takeSecrets(media.customData);
                takeSecrets(loadRequestData.customData);
                const queued = (loadRequestData.queueData && loadRequestData.queueData.items) || [];
                for (const item of queued) {
                    takeSecrets(item.customData);
                    takeSecrets(item.media && item.media.customData);
                }
                const customData = Object.assign({}, media.customData, heldSecrets);

                // Cache live/VOD for the reconnect path, which may run when
                // getMediaInformation() is null.
                streamIsLive =
                    media.streamType === cast.framework.messages.StreamType.LIVE;

                if (customData.stream_url) media.contentId = customData.stream_url;
                if (customData.content_type) media.contentType = customData.content_type;

                // A rewound live cast resumes behind the live edge once the window is known. Re-apply
                // it on a reconnect too: the seek is relative to the current live edge, so re-running
                // it after a blip keeps the viewer the same distance behind live rather than snapping
                // to it. Cancel any retry still pending from the previous load first.
                if (rewindRetryTimer !== null) {
                    clearTimeout(rewindRetryTimer);
                    rewindRetryTimer = null;
                }
                // A reload of our own says where it comes back to; kept apart from the request, which
                // the framework may hand back as a copy.
                const rewindAsked = (isReconnect && reloadLiveRewindSec !== null)
                    ? reloadLiveRewindSec : customData.live_rewind_sec;
                reloadLiveRewindSec = null;
                pendingLiveRewindSec = (streamIsLive && rewindAsked > 0) ? rewindAsked : 0;
                liveJoinPending = streamIsLive;
                parkedTicks = 0;
                playedSinceLoad = false;
                rewindRetries = 0;

                // The programme air-window for the live bar; live only, 0 when not supplied.
                programStartMs = streamIsLive ? (Number(customData.program_start_ms) || 0) : 0;
                programEndMs = streamIsLive ? (Number(customData.program_end_ms) || 0) : 0;

                // Drive continue-watching from the receiver (the phone may be away while casting).
                setupPlayhead(customData);

                // Look for the ad breaks of what is loaded, to offer to skip them.
                adSkip.load(media, customData);

                const playbackConfig = Object.assign(
                    new cast.framework.PlaybackConfig(), playerManager.getPlaybackConfig());

                // Buffer tuning and the preferred audio language apply to every
                // stream, DRM-protected or not. The CAF property is shakaConfig;
                // retryParameters let transient network failures recover on
                // their own before they ever become fatal.
                const retryParameters = {
                    maxAttempts: 6,
                    baseDelay: 1000,
                    backoffFactor: 2,
                    timeout: 30000
                };
                playbackConfig.segmentRequestRetryLimit = 5;
                playbackConfig.shakaConfig = {
                    streaming: {
                        // VOD/replay/recording buffers far ahead so a Chromecast-side network drop
                        // drains the buffer instead of stalling the show. Shaka caps this to the MSE
                        // quota, so a low-RAM Cast device simply buffers less rather than running out
                        // of memory. Live stays small: it cannot buffer past the live edge, so a
                        // larger goal would be wasted.
                        bufferingGoal: streamIsLive ? 30 : 120,
                        rebufferingGoal: 15,
                        bufferBehind: 30,
                        alwaysStreamText: true,
                        // Subtitles are streamed even when hidden, and a recording's text track can
                        // end before its video (its last segments answer 404): without this, that
                        // failure stops the video too, near the end of the recording, on every reload.
                        ignoreTextStreamFailures: true,
                        retryParameters
                    },
                    manifest: { retryParameters },
                    drm: { retryParameters },
                    // Restore a manual audio choice across an auto-reconnect,
                    // otherwise default to French.
                    preferredAudioLanguage:
                        (userSelectedAudio && userAudioLanguage) || 'fra'
                };

                // Clear any DRM settings carried over from the previous stream, so a
                // following clear stream is not treated as Widevine with stale
                // credentials. The block below re-sets them when the stream needs DRM.
                playbackConfig.protectionSystem = undefined;
                playbackConfig.licenseUrl = undefined;
                playbackConfig.licenseRequestHandler = undefined;
                playbackConfig.licenseHandler = undefined;

                if (customData.license_url && customData.drm_token) {
                    playbackConfig.protectionSystem = cast.framework.ContentProtection.WIDEVINE;

                    let licenseUrl = customData.license_url;
                    if (customData.asset_id) {
                        const separator = licenseUrl.includes('?') ? '&' : '?';
                        licenseUrl += separator + 'assetId='
                            + encodeURIComponent(customData.asset_id);
                    }
                    playbackConfig.licenseUrl = licenseUrl;

                    playbackConfig.licenseRequestHandler = requestInfo => {
                        requestInfo.withCredentials = true;
                        requestInfo.headers['x-dt-auth-token'] = customData.drm_token;
                    };

                    playbackConfig.licenseHandler = data => {
                        try {
                            const str = new TextDecoder().decode(data);
                            const json = JSON.parse(str);
                            if (json.license) {
                                const binaryString = atob(json.license);
                                const bytes = new Uint8Array(binaryString.length);
                                for (let i = 0; i < binaryString.length; i++) {
                                    bytes[i] = binaryString.charCodeAt(i);
                                }
                                return bytes;
                            }
                            console.warn('[Etincelle] License response has no .license field, passing raw data');
                        } catch (e) {
                            console.error('[Etincelle] License response parse failed:', e);
                        }
                        return data;
                    };
                }

                playerManager.setPlaybackConfig(playbackConfig);
                // Cache the resolved request so a later failure can reload it.
                lastLoadRequest = loadRequestData;
                return loadRequestData;
            }
        );

        // The LOAD interceptor keeps the credentials out of what plays, but the framework builds the
        // status from copies of the request it took before: the item being loaded (extendedStatus,
        // while one stream replaces another) and the queue items still carried the DRM token to any
        // device of the network. So nothing leaves with a credential in it, wherever it sits. The
        // status is the framework's own, shared with what it plays from: it is copied, never changed.
        function cloneOf(object) {
            return Object.assign(Object.create(Object.getPrototypeOf(object)), object);
        }
        function withoutSecrets(data) {
            if (!data || typeof data !== 'object' || !SECRET_KEYS.some(key => key in data)) return data;
            const copy = cloneOf(data);
            for (const key of SECRET_KEYS) delete copy[key];
            return copy;
        }
        // A status, an extended status or a queue item, with no credential in its customData nor in
        // that of its media.
        function publishable(holder) {
            if (!holder || typeof holder !== 'object') return holder;
            const copy = cloneOf(holder);
            if (holder.customData) copy.customData = withoutSecrets(holder.customData);
            if (holder.media && holder.media.customData) {
                copy.media = cloneOf(holder.media);
                copy.media.customData = withoutSecrets(holder.media.customData);
            }
            return copy;
        }
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.MEDIA_STATUS,
            status => {
                if (!status) return status;
                const out = publishable(status);
                // What the search for ad breaks is at, for whoever looks into a cast that will not skip.
                try {
                    out.customData = Object.assign({}, out.customData, {
                        ad_skip: adSkip.report(),
                        // The programme the live bar is scaled to, as the sender gave it (epoch ms, 0 when none).
                        programme: { start: programStartMs, end: programEndMs }
                    });
                } catch (e) {
                    // The status goes without it.
                }
                if (status.extendedStatus) out.extendedStatus = publishable(status.extendedStatus);
                if (Array.isArray(status.items)) out.items = status.items.map(publishable);
                if (status.queueData && Array.isArray(status.queueData.items)) {
                    out.queueData = cloneOf(status.queueData);
                    out.queueData.items = status.queueData.items.map(publishable);
                }
                return out;
            }
        );

        // A STOP command (the remote's stop button, or a sender stop) ends casting: flag it so the
        // self-reconnect cannot heal playback back up, then tear the receiver down. The phone only
        // sends STOP when it is leaving this receiver, so this never fires on a normal channel change.
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.STOP,
            request => {
                stopCasting();
                return request;
            }
        );

        // Highlight the first control so the menu has a selection on first open.
        updateMenuSelection();

        // Start Receiver
        const options = new cast.framework.CastReceiverOptions();
        options.supportedCommands = cast.framework.messages.Command.ALL_BASIC_COMMANDS |
                                    cast.framework.messages.Command.EDIT_TRACKS |
                                    cast.framework.messages.Command.SEEK;

        context.start(options);
    </script>
</body>
</html>
