<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Etincelle Receiver</title>
    <!-- Official Receiver: https://chromecast.cloud-01.molotov.tv/ -->
    <!-- Google does not offer a pinned CDN path; v3 is a rolling channel -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        cast-media-player {
            --advancement-background-color: rgba(0,0,0,0.8);
        }

        /* Control Menu Overlay */
        #control-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 40px 20px 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            z-index: 1000;
        }
        #control-menu.visible {
            transform: translateY(0);
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 25px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-family: 'Roboto', sans-serif;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 100px;
        }
        .menu-item.selected {
            background: rgba(229, 9, 20, 0.9);
            transform: scale(1.1);
        }
        .menu-item .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .menu-item .label {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Track submenu (audio / subtitles) */
        #track-submenu {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.95);
            border-radius: 8px;
            padding: 10px 0;
            min-width: 200px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            z-index: 1001;
        }
        #track-submenu.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .track-option {
            padding: 12px 20px;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
        }
        .track-option.selected {
            background: rgba(229, 9, 20, 0.9);
        }
        .track-option.active::after {
            content: ' ✓';
            color: #4CAF50;
        }

        /* Hint overlay */
        #menu-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.5);
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #menu-hint.visible {
            opacity: 1;
        }

        /* Seek preview overlay */
        #seek-preview {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.85);
            border-radius: 8px;
            padding: 14px 22px;
            min-width: 320px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 1002;
            font-family: 'Roboto', sans-serif;
        }
        #seek-preview.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #seek-preview-label {
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 18px;
            margin-bottom: 10px;
        }
        #seek-preview-delta {
            color: #e50914;
            font-weight: bold;
        }
        #seek-preview-track {
            height: 4px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
            overflow: hidden;
        }
        #seek-preview-fill {
            height: 100%;
            width: 0%;
            background: #e50914;
            transition: width 0.1s linear;
        }

        /* Transient notice (errors, empty track lists) */
        #notice {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 80%;
            background: rgba(0,0,0,0.9);
            color: #fff;
            font-family: 'Roboto', sans-serif;
            font-size: 18px;
            text-align: center;
            padding: 14px 24px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 2000;
        }
        #notice.visible {
            opacity: 1;
        }

        /* The offer to skip the ad break being played: OK takes it. */
        #skip-pill {
            position: fixed;
            right: 48px;
            bottom: 96px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            font-family: 'Roboto', sans-serif;
            font-size: 22px;
            padding: 12px 24px;
            border: 2px solid #ffd60a;
            border-radius: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1500;
        }
        #skip-pill.visible {
            opacity: 1;
        }

        /* Live programme bar (mirrors the phone): scaled to the current programme, the live edge
           part-way along it and the not-yet-aired remainder dimmer past it, the stretch too old to
           rewind to in a distinct colour. Shown only while the user is actively seeking, alongside the
           seek preview; hidden during passive playback. */
        #program-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 28px;
            padding: 0 48px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 999;
            pointer-events: none;
        }
        #program-bar.visible {
            opacity: 1;
        }
        #program-bar-track {
            position: relative;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.15);
        }
        #pb-aired {
            position: absolute;
            top: 0;
            height: 100%;
            border-radius: 3px;
            background: rgba(255,255,255,0.30);
        }
        #pb-earlier {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            border-radius: 3px;
            background: #5b6478;
        }
        #pb-played {
            position: absolute;
            top: 0;
            height: 100%;
            background: #ffc107;
        }
        #pb-live {
            position: absolute;
            top: -4px;
            width: 2px;
            height: 14px;
            margin-left: -2px;
            background: #e50914;
        }
        #pb-thumb {
            position: absolute;
            top: -3px;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            border-radius: 50%;
            background: #fff;
        }
    </style>
</head>
<body>
    <cast-media-player></cast-media-player>

    <!-- Control Menu -->
    <div id="control-menu">
        <div class="menu-item" data-action="back">
            <span class="icon">⏪</span>
            <span class="label">-10s</span>
        </div>
        <div class="menu-item" data-action="forward">
            <span class="icon">⏩</span>
            <span class="label">+30s</span>
        </div>
        <div class="menu-item" data-action="restart">
            <span class="icon">↺</span>
            <span class="label">Au début</span>
        </div>
        <div class="menu-item" data-action="audio">
            <span class="icon">🔊</span>
            <span class="label">Audio</span>
        </div>
        <div class="menu-item" data-action="subtitles">
            <span class="icon">💬</span>
            <span class="label">Sous-titres</span>
        </div>
    </div>

    <!-- Track Submenu (audio / subtitles) -->
    <div id="track-submenu"></div>

    <!-- Menu Hint -->
    <div id="menu-hint">Appuyez sur ↓ pour les commandes</div>

    <!-- Transient notice -->
    <div id="notice"></div>

    <!-- Offer to skip an ad break -->
    <div id="skip-pill">Passer la pub : OK</div>

    <!-- Seek Preview -->
    <div id="seek-preview">
        <div id="seek-preview-label">
            <span id="seek-preview-time">0:00</span>
            <span id="seek-preview-delta"></span>
        </div>
        <div id="seek-preview-track">
            <div id="seek-preview-fill"></div>
        </div>
    </div>

    <!-- Live programme bar -->
    <div id="program-bar">
        <div id="program-bar-track">
            <div id="pb-aired"></div>
            <div id="pb-earlier"></div>
            <div id="pb-played"></div>
            <div id="pb-live"></div>
            <div id="pb-thumb"></div>
        </div>
    </div>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        // Menu State
        let menuVisible = false;
        let trackMenuVisible = false;
        let trackMenuType = null;        // 'AUDIO' or 'TEXT' while the submenu is open
        let selectedIndex = 0;
        let trackSelectedIndex = 0;
        let trackOptions = [];           // [{ trackId, label, language }] for the open submenu
        let hideHintTimer = null;
        let hideMenuTimer = null;
        // Set when the user picks an audio track; stops the auto French override.
        // userAudioTrackId / userAudioLanguage remember the choice so it survives an
        // auto-reconnect, which reloads the same stream from its default audio again.
        let userSelectedAudio = false;
        let userAudioLanguage = null;
        let userAudioTrackId = null;
        // The same for the subtitles, whose choice may be none (a null track id).
        let userSelectedText = false;
        let userTextLanguage = null;
        let userTextTrackId = null;
        // Set once the control hint has been shown, so it appears only on the
        // first load and not on every channel change.
        let hintShown = false;

        // Self-recovery state. lastLoadRequest is the resolved request cached
        // from the interceptor so a failed stream can be reloaded by itself.
        const RECONNECT_BASE_DELAY = 2000;
        const RECONNECT_MAX_DELAY = 30000;
        // Stop self-reconnecting after this many consecutive failed attempts. A
        // reload replays the cached stream URL and DRM token, which the backend
        // issues short-lived; once they expire every retry fails identically, so
        // looping past this only flashes a notice over a black screen. With the
        // backoff above this is roughly three and a half minutes, long enough to
        // ride out a transient outage but bounded so a dead session gives up.
        const RECONNECT_MAX_ATTEMPTS = 10;
        // Bound a reconnect load() that never settles. A wedged Widevine/CDM
        // session or a stuck media buffer can leave load() pending forever,
        // outside Shaka's per-request retries; that would pin recovering=true and
        // silently disable both the error and the stall paths. If a reload neither
        // succeeds nor fails within this long, treat it as failed and re-arm.
        const RECONNECT_LOAD_TIMEOUT = 45000;
        let lastLoadRequest = null;
        let reconnectAttempts = 0;
        let reconnectTimer = null;
        let loadGuardTimer = null;
        let recovering = false;
        // After a playback error, hold off our own (stale-token) reload this long to let the phone
        // re-resolve fresh credentials and re-cast, which supersedes it; self-reconnect only if no
        // fresh cast arrives (e.g. the phone is away). The phone is the only side that can refresh the
        // short-lived stream/DRM tokens.
        const RESOLVE_GRACE_MS = 4000;
        let reconnectFallbackTimer = null;
        // Bumped whenever recovery completes (a fresh cast supersedes us, or playback resumes) so an
        // in-flight reconnect load() that gets superseded does not re-arm another reconnect over the
        // now-healthy stream when its own promise later rejects (e.g. aborted by the fresh cast).
        let reconnectGeneration = 0;
        // Set when the user stops or exits from the remote (STOP command or back/exit). It keeps the
        // self-reconnect from healing playback back up, so a stop stops instead of restarting. Reset on
        // the next genuine LOAD (a fresh cast).
        let userStopped = false;

        // The account's credentials in a LOAD's customData. A Chromecast gives its media status, with
        // the customData of what plays, to any device of the network that asks: they are moved out of
        // the request into heldSecrets as it loads, so the status never carries them.
        const SECRET_KEYS = ['access_token', 'refresh_token', 'drm_token', 'profile_id', 'user_id'];
        let heldSecrets = {};
        function takeSecrets(data) {
            if (!data) return;
            for (const key of SECRET_KEYS) {
                if (key in data) {
                    heldSecrets[key] = data[key];
                    delete data[key];
                }
            }
        }

        // Stall watchdog: a hung segment download can sit in BUFFERING forever
        // without firing an error, so reload when the media clock stops
        // advancing while playback should be progressing.
        const STALL_CHECK_INTERVAL = 5000;
        const STALL_TIMEOUT = 15000;
        const STARTUP_STALL_TIMEOUT = 45000;
        // The stream loaded last has got as far as playing.
        let playedSinceLoad = false;
        // -1 is a value the media clock never reports, so the first observation
        // always re-baselines instead of looking like a stall.
        let lastMediaTime = -1;
        let stalledFor = 0;

        // Last playback position seen while playing, so a reconnect can resume a
        // VOD where it was even when the media clock has collapsed to 0 in a
        // torn-down error state. Senders cast VOD with currentTime 0 (the real
        // start offset arrives as a separate post-load seek or the initial
        // resume point) and never advance it, so without this a missed sample
        // reloads from the beginning. Live is excluded: it rejoins the edge.
        let lastKnownPos = 0;
        // Cached at load because getMediaInformation() can be null mid-recovery,
        // so a reconnect cannot rely on it to tell live from VOD.
        let streamIsLive = false;
        // A rewound live cast (live_rewind_sec in the LOAD customData) asks us to resume this many
        // seconds behind the live edge, applied once playback has started (see applyPendingRewind).
        let pendingLiveRewindSec = 0;
        // A live stream was loaded and has not been seen to join the live point yet (see
        // applyPendingRewind), and for how many of its looks it has been playing at the window start.
        let liveJoinPending = false;
        let parkedTicks = 0;
        const PARKED_MAX_TICKS = 34;
        // The rewind a reload of our own is to come back to, null when it has none to say.
        let reloadLiveRewindSec = null;
        // How far behind the live point a live stream was last seen playing (s), null when not known:
        // where a reload of our own takes it back to. Closer than LIVE_POINT_SEC is the live point.
        let liveBehindSec = null;
        const LIVE_POINT_SEC = 30;
        let rewindRetries = 0;
        let rewindRetryTimer = null;
        // How often and how many times to check whether the rewind can be applied: playback can start
        // well after the load completes (the DRM handshake alone can take ten seconds or more).
        const REWIND_RETRY_INTERVAL = 300;
        const REWIND_MAX_RETRIES = 400;
        // Right after a load the player briefly reports PLAYING at the very start of its clock, before
        // it joins the window; it has joined once the playhead is this far (s) past the window start.
        const REWIND_JOIN_MARGIN = 5;

        // The on-screen programme's air-window (epoch ms) from the LOAD customData, so the live bar can
        // mark the current show. 0 when the sender gives no times; the bar then spans the window plain.
        let programStartMs = 0;
        let programEndMs = 0;

        // Continue-watching: the receiver POSTs the playback position to the Fubo playhead while
        // casting, because the phone is not reliably present during a cast session. All of these are
        // populated from the LOAD customData; they stay null (no reporting) when it is absent.
        const PLAYHEAD_INTERVAL = 10000;
        let playheadUrl = null;
        let playheadPayload = null;
        let playheadHeaders = null;
        let playheadDurationSec = 0;
        // Where the episode's credits start (s), once its next episode is announced; 0 when unknown.
        let playheadCreditsSec = 0;
        let playheadLastSent = -1;
        let playheadTimer = null;
        let playheadInflight = false;

        // Seek state
        const SEEK_STEP_BACK = -10;
        const SEEK_STEP_FWD = 30;
        const SEEK_COMMIT_DELAY = 400;
        const SEEK_PREVIEW_LINGER = 800;
        // Holding the key auto-repeats keydown; each repeat in the same direction
        // grows the step, so a held button scrubs faster the longer it is held
        // (capped). Distinct taps do not accelerate. The ramp is steep and the cap
        // high so a held rewind crosses the 4h DVR window in a few seconds.
        const SEEK_ACCEL_STEP = 1.5;
        const SEEK_MAX_MULTIPLIER = 50;
        let pendingSeekTime = null;
        let seekCommitTimer = null;
        let hideSeekPreviewTimer = null;
        let seekRepeat = 0;
        let seekDir = 0;
        // The programme bar rides with the seek preview: shown only while actively scrubbing, not during
        // passive playback. True from the first seek key until the preview lingers out.
        let seekOverlayActive = false;
        // A rewind stops at the current programme's start ("don't go before the current show"); the user
        // breaks past it by pressing back again once parked there. holdShowStart re-arms once playback
        // returns inside the show, so the next rewind stops at the start again.
        let holdShowStart = true;
        let showStartParked = false;

        // DOM Elements
        const controlMenu = document.getElementById('control-menu');
        const menuItems = controlMenu.querySelectorAll('.menu-item');
        const trackSubmenu = document.getElementById('track-submenu');
        const menuHint = document.getElementById('menu-hint');
        const seekPreview = document.getElementById('seek-preview');
        const seekPreviewTime = document.getElementById('seek-preview-time');
        const seekPreviewDelta = document.getElementById('seek-preview-delta');
        const seekPreviewTrack = document.getElementById('seek-preview-track');
        const seekPreviewFill = document.getElementById('seek-preview-fill');
        const notice = document.getElementById('notice');
        const programBar = document.getElementById('program-bar');
        const pbAired = document.getElementById('pb-aired');
        const pbEarlier = document.getElementById('pb-earlier');
        const pbPlayed = document.getElementById('pb-played');
        const pbLive = document.getElementById('pb-live');
        const pbThumb = document.getElementById('pb-thumb');

        // Transient Notice
        // The receiver otherwise fails to a black screen with no indication of
        // what went wrong, so surface playback errors and similar conditions.
        let hideNoticeTimer = null;
        // The notice on screen is one of the recovery's own, for it to take down when playback is back.
        let noticeOfRecovery = false;
        // A persistent notice (the terminal "cast again" message) stays up until
        // something replaces or clears it; a transient one auto-hides.
        function showNotice(message, persistent, ofRecovery) {
            noticeOfRecovery = !!ofRecovery;
            notice.textContent = message;
            notice.classList.add('visible');
            clearTimeout(hideNoticeTimer);
            clearTimeout(hideHintTimer);
            menuHint.classList.remove('visible');
            if (persistent) return;
            hideNoticeTimer = setTimeout(() => {
                notice.classList.remove('visible');
            }, 6000);
        }

        function hideNotice() {
            clearTimeout(hideNoticeTimer);
            notice.classList.remove('visible');
        }

        // Menu Visibility
        function showMenu() {
            menuVisible = true;
            controlMenu.classList.add('visible');
            menuHint.classList.remove('visible');
            resetHideMenuTimer();
        }

        function hideMenu() {
            menuVisible = false;
            trackMenuVisible = false;
            controlMenu.classList.remove('visible');
            trackSubmenu.classList.remove('visible');
            clearTimeout(hideMenuTimer);
        }

        // Live programme bar: redraw the bar scaled to the current programme, with the live edge
        // part-way along it (the window's max is "now"). Shown only while a seek is in progress (it rides
        // with the seek preview overlay); during passive playback there is nothing to scrub, so a bar on
        // screen would just be clutter. While seeking the thumb tracks the pending seek target. Still needs
        // a live stream with a current programme and a usable window; any gap hides the bar.
        function updateProgramBar() {
            try {
                if (!seekOverlayActive || !streamIsLive) { programBar.classList.remove('visible'); return; }
                // Only mark an actual current programme; no bounds (older sender) or past its end: no bar.
                const hasBand = programStartMs > 0 && programEndMs > 0 && Date.now() <= programEndMs;
                if (!hasBand) { programBar.classList.remove('visible'); return; }
                const bounds = getSeekBounds();
                if (!bounds || bounds.max === null || !(bounds.max > bounds.min)) { programBar.classList.remove('visible'); return; }
                const programDurMs = programEndMs - programStartMs;
                if (!(programDurMs > 0)) { programBar.classList.remove('visible'); return; }
                const now = Date.now();
                const clamp01 = v => (Number.isFinite(v) ? (v < 0 ? 0 : (v > 1 ? 1 : v)) : 0);
                // The window's max is the live edge ("now"); map a player-time position (sec) to wall-clock,
                // then to a fraction of the programme so the show fills the whole bar.
                const wallFrac = t => clamp01((now - (bounds.max - t) * 1000 - programStartMs) / programDurMs);
                // Track the pending seek target while scrubbing; fall back to the live playhead.
                const current = (pendingSeekTime !== null) ? pendingSeekTime : playerManager.getCurrentTimeSec();
                const playedFrac = wallFrac(current);
                const liveFrac = wallFrac(bounds.max);
                // The DVR buffer only reaches back to the window start, so earlier parts of the show can no
                // longer be rewound to; mark that floor in a distinct colour (0 when the show began inside it).
                const seekFloorFrac = wallFrac(bounds.min);
                pbEarlier.style.width = (seekFloorFrac * 100) + '%';
                pbAired.style.left = (seekFloorFrac * 100) + '%';
                pbAired.style.width = (Math.max(0, liveFrac - seekFloorFrac) * 100) + '%';
                pbPlayed.style.left = (seekFloorFrac * 100) + '%';
                pbPlayed.style.width = (Math.max(0, playedFrac - seekFloorFrac) * 100) + '%';
                pbLive.style.left = (liveFrac * 100) + '%';
                pbThumb.style.left = (playedFrac * 100) + '%';
                programBar.classList.add('visible');
            } catch (e) {
                programBar.classList.remove('visible');
            }
        }

        // Toggle play/pause from the remote's media key. The control menu has no play/pause item and
        // CAF does not pause this live stream from the raw keydown on its own, so handle it explicitly.
        function togglePlayPause() {
            const messages = cast.framework.messages;
            if (playerManager.getPlayerState() === messages.PlayerState.PAUSED) {
                playerManager.play();
            } else {
                playerManager.pause();
            }
        }

        function resetHideMenuTimer() {
            clearTimeout(hideMenuTimer);
            hideMenuTimer = setTimeout(() => {
                // hideMenu() closes the track submenu too, so an idle timeout
                // dismisses the whole overlay whether or not the submenu is open.
                if (menuVisible) {
                    hideMenu();
                }
            }, 5000);
        }

        // Menu Navigation
        function updateMenuSelection() {
            menuItems.forEach((item, index) => {
                item.classList.toggle('selected', index === selectedIndex);
            });
        }

        function navigateMenu(direction) {
            if (!menuVisible) return;
            resetHideMenuTimer();

            selectedIndex += direction;
            if (selectedIndex < 0) selectedIndex = menuItems.length - 1;
            if (selectedIndex >= menuItems.length) selectedIndex = 0;
            updateMenuSelection();
        }

        function activateMenuItem() {
            if (!menuVisible) return;
            resetHideMenuTimer();

            if (trackMenuVisible) {
                selectTrack();
                return;
            }

            const action = menuItems[selectedIndex].dataset.action;
            executeAction(action);
        }

        // Actions
        function executeAction(action) {
            const currentTime = playerManager.getCurrentTimeSec();

            switch (action) {
                case 'back':
                    clampedSeek(currentTime + SEEK_STEP_BACK);
                    break;
                case 'forward':
                    clampedSeek(currentTime + SEEK_STEP_FWD);
                    break;
                case 'restart': {
                    // The start of the programme on a live stream, whose own start is hours before it.
                    // One on air since before the window began goes as far back as the window does.
                    const bounds = getSeekBounds();
                    const began = showBeganAt(bounds);
                    if (began !== null && began < bounds.max) {
                        clampedSeek(began);
                    } else if (streamIsLive) {
                        // Its start is not known, or the programme the cast began on has ended: 0 would
                        // be the start of the window, four hours back.
                        showNotice('Début du programme inconnu');
                    } else {
                        clampedSeek(0);
                    }
                    break;
                }
                case 'audio':
                    if (!showTrackMenu('AUDIO')) showNotice('Aucune piste audio disponible');
                    return; // Don't hide menu
                case 'subtitles':
                    if (!showTrackMenu('TEXT')) showNotice('Aucun sous-titre disponible');
                    return; // Don't hide menu
            }

            // Brief feedback then hide
            setTimeout(hideMenu, 500);
        }

        // Seek Controls
        // Returns the seekable bounds {min, max} for the current media, or null
        // when nothing is loaded or a live stream exposes no timeshift window.
        // max is null when the upper bound is unknown (VOD without a duration).
        function getSeekBounds() {
            const mediaInfo = playerManager.getMediaInformation();
            if (!mediaInfo) return null;

            const messages = cast.framework.messages;
            if (mediaInfo.streamType === messages.StreamType.LIVE) {
                const range = playerManager.getLiveSeekableRange();
                if (range && Number.isFinite(range.start)
                    && Number.isFinite(range.end) && range.end > range.start) {
                    return { min: range.start, max: range.end };
                }
                // Live stream without a usable seekable window: seeking not possible.
                return null;
            }

            const dur = playerManager.getDurationSec();
            if (!Number.isNaN(dur) && dur > 0) {
                return { min: 0, max: dur };
            }
            // VOD with unknown duration: clamp only at the start.
            return { min: 0, max: null };
        }

        function clampBounds(value, bounds) {
            let t = value;
            // A non-finite target (e.g. a seek attempted before the media clock is
            // ready) slips through the comparisons below unclamped, so pin it to the
            // lower bound rather than forwarding NaN to seek().
            if (!Number.isFinite(t)) return bounds.min;
            if (t < bounds.min) t = bounds.min;
            if (bounds.max !== null && t > bounds.max) t = bounds.max;
            return t;
        }

        // The player-time position (sec) of the current programme's start, or null when there is no
        // usable in-show floor. The window's max is the live edge ("now"), so the show began
        // (now - programStartMs) ms before it. Mirrors the wall-clock mapping (and the same airing-now
        // validity) the programme bar uses, so a stale programme (the cached window only refreshes on a
        // new LOAD, not on rollover) or a not-yet-started one yields no floor; the result must also sit
        // strictly inside the seekable window to be a usable floor.
        function showStartTime(bounds) {
            const t = showBeganAt(bounds);
            return (t !== null && t > bounds.min && t < bounds.max) ? t : null;
        }

        // The media time the programme on air began at, which is before the seekable window for one
        // on air for longer than the window is; null when it is not known.
        function showBeganAt(bounds) {
            if (!(programStartMs > 0) || !(programEndMs > 0)) return null;
            if (!bounds || bounds.max === null) return null;
            const now = Date.now();
            if (now < programStartMs || now > programEndMs) return null;
            return bounds.max - (now - programStartMs) / 1000;
        }

        // Absolute seek in seconds, clamped to the current media bounds.
        function clampedSeek(target) {
            const bounds = getSeekBounds();
            if (!bounds) return;
            playerManager.seek(clampBounds(target, bounds));
        }

        // Resume a rewound live cast behind the live edge, once playback has started and the seekable
        // window is known. A seek made before playback starts is lost: the player then joins the live
        // edge. Both can lag load completion, so retry for a while before giving up. The pending timer
        // is tracked so a new LOAD can cancel a stale retry.
        // Notes how far behind the live point playback is, when the player can tell.
        function noteLiveBehind() {
            const bounds = getSeekBounds();
            const t = playerManager.getCurrentTimeSec();
            // Not at the start of the window, where a stream being loaded plays for a moment before it
            // joins the live point: that would read as a rewind of the whole window.
            if (!bounds || bounds.max === null || !Number.isFinite(t) || t <= bounds.min + REWIND_JOIN_MARGIN) return;
            liveBehindSec = Math.max(0, bounds.max - t);
        }

        function applyPendingRewind() {
            rewindRetryTimer = null;
            if (!liveJoinPending) return;
            const bounds = getSeekBounds();
            const playing = playerManager.getPlayerState() === cast.framework.messages.PlayerState.PLAYING;
            const ready = !!bounds && bounds.max !== null && playing;
            const joined = ready && playerManager.getCurrentTimeSec() > bounds.min + REWIND_JOIN_MARGIN;
            if (!joined) {
                // Playing, and still at the start of its window after ten seconds: the jump to the live
                // point is not coming, and nothing else would ever move it from there, four hours back.
                const parked = ready && ++parkedTicks >= PARKED_MAX_TICKS;
                if (!parked) {
                    if (rewindRetries++ < REWIND_MAX_RETRIES) {
                        rewindRetryTimer = setTimeout(applyPendingRewind, REWIND_RETRY_INTERVAL);
                    } else {
                        endLiveJoin();
                    }
                    return;
                }
            }
            // Joined, to the rewind the cast asked for; or found parked, to that rewind or to the live
            // point itself.
            if (pendingLiveRewindSec > 0 || !joined) {
                playerManager.seek(clampBounds(bounds.max - pendingLiveRewindSec, bounds));
            }
            endLiveJoin();
        }

        function endLiveJoin() {
            liveJoinPending = false;
            pendingLiveRewindSec = 0;
            rewindRetries = 0;
            parkedTicks = 0;
        }

        function formatTime(totalSec) {
            if (!Number.isFinite(totalSec) || totalSec < 0) totalSec = 0;
            totalSec = Math.floor(totalSec);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            const mm = (h > 0 && m < 10) ? '0' + m : '' + m;
            const ss = s < 10 ? '0' + s : '' + s;
            return h > 0 ? (h + ':' + mm + ':' + ss) : (mm + ':' + ss);
        }

        function formatDelta(deltaSec) {
            const sign = deltaSec < 0 ? '-' : '+';
            return sign + formatTime(Math.abs(deltaSec));
        }

        function renderSeekPreview(target, bounds, speed) {
            const current = playerManager.getCurrentTimeSec();
            // Only show the jump size when the current position is known; a NaN clock
            // would otherwise render a misleading +0:00 beside a valid target time.
            let deltaText = Number.isFinite(current)
                ? formatDelta(Math.round(target - current))
                : '';
            if (speed >= 2) {
                deltaText += '  ×' + Math.round(speed);
            }
            seekPreviewTime.textContent = formatTime(target);
            seekPreviewDelta.textContent = deltaText;

            if (bounds.max !== null && bounds.max > bounds.min) {
                const frac = (target - bounds.min) / (bounds.max - bounds.min);
                seekPreviewFill.style.width =
                    (Math.max(0, Math.min(1, frac)) * 100) + '%';
                seekPreviewTrack.style.visibility = 'visible';
            } else {
                seekPreviewTrack.style.visibility = 'hidden';
            }
        }

        function showSeekPreview() {
            clearTimeout(hideSeekPreviewTimer);
            seekPreview.classList.add('visible');
            // Raise the programme bar alongside the preview and draw the band for the current seek target.
            seekOverlayActive = true;
            updateProgramBar();
        }

        function hideSeekPreview() {
            seekPreview.classList.remove('visible');
            // Drop the programme bar in lockstep with the seek preview.
            seekOverlayActive = false;
            programBar.classList.remove('visible');
        }

        // Accumulate a relative seek and arm the debounce timer. Repeated key
        // presses build up a single target so the stream is only seeked once.
        function stepSeek(deltaSec, isRepeat) {
            if (menuVisible || trackMenuVisible) return;

            const bounds = getSeekBounds();
            if (!bounds) return;

            // Accelerate only while the button is genuinely held (key auto-repeat):
            // count consecutive repeats in the same direction and grow the step, so
            // distinct deliberate taps each start at the base step rather than
            // compounding into an oversized jump.
            const direction = deltaSec < 0 ? -1 : 1;
            if (isRepeat && direction === seekDir) {
                seekRepeat++;
            } else {
                seekRepeat = 0;
            }
            seekDir = direction;

            // A fresh back press while parked at the show start releases the clamp ("really needed"),
            // so the next rewind reaches the full DVR window behind the current programme.
            if (direction < 0 && !isRepeat && showStartParked) holdShowStart = false;

            const multiplier = Math.min(
                SEEK_MAX_MULTIPLIER, 1 + seekRepeat * SEEK_ACCEL_STEP
            );

            const base = (pendingSeekTime !== null)
                ? pendingSeekTime
                : playerManager.getCurrentTimeSec();
            // Hold a backward seek at the current programme's start unless the user has opted past it.
            const showStart = showStartTime(bounds);
            // Only from within the programme: before its start already, the hold would send any
            // press, forward ones too, up to that start.
            const holding = holdShowStart && showStart !== null && base >= showStart;
            const floor = holding ? showStart : bounds.min;
            let target = clampBounds(base + deltaSec * multiplier, bounds);
            if (target < floor) target = floor;
            pendingSeekTime = target;

            // Parked at the show start: arm the break-through and, on first arrival, say how to pass it.
            const parked = holding && target <= floor + 1;
            if (parked && !showStartParked) {
                showNotice('Début de l\'émission, appuyez encore sur ◀ pour reculer plus loin');
            }
            showStartParked = parked;
            // Re-arm the clamp once playback is back inside the show, so a later rewind stops here again.
            if (showStart !== null && target > showStart + 1) holdShowStart = true;

            renderSeekPreview(pendingSeekTime, bounds, multiplier);
            showSeekPreview();

            clearTimeout(seekCommitTimer);
            seekCommitTimer = setTimeout(commitSeek, SEEK_COMMIT_DELAY);
        }

        // Issue the accumulated seek as a single clamped seek operation.
        function doSeekCommit() {
            clearTimeout(seekCommitTimer);
            seekCommitTimer = null;
            seekRepeat = 0;
            seekDir = 0;
            if (pendingSeekTime !== null) {
                clampedSeek(pendingSeekTime);
                pendingSeekTime = null;
            }
        }

        function commitSeek() {
            doSeekCommit();
            // Keep the preview briefly so the landing point stays visible.
            clearTimeout(hideSeekPreviewTimer);
            hideSeekPreviewTimer = setTimeout(hideSeekPreview, SEEK_PREVIEW_LINGER);
        }

        // Commit any pending seek immediately and clear the preview, used when
        // the control menu takes over the LEFT/RIGHT keys.
        function flushPendingSeek() {
            doSeekCommit();
            hideSeekPreview();
        }

        // Discard any pending seek without committing it, used when the media is
        // replaced so a stale target cannot seek the new stream.
        function cancelPendingSeek() {
            clearTimeout(seekCommitTimer);
            seekCommitTimer = null;
            clearTimeout(hideSeekPreviewTimer);
            seekRepeat = 0;
            seekDir = 0;
            pendingSeekTime = null;
            // A fresh stream starts with the show-start clamp armed again.
            holdShowStart = true;
            showStartParked = false;
            hideSeekPreview();
        }

        // Audio and subtitles are handled by separate CAF track managers: the
        // audio manager exposes a single active track, the text manager a set.
        // These helpers present both through a common shape so the menu code
        // stays uniform.
        function tracksManagerOfType(type) {
            return type === 'AUDIO'
                ? playerManager.getAudioTracksManager()
                : playerManager.getTextTracksManager();
        }

        // Tracks of `type` ('AUDIO' or 'TEXT'), or [] when none are loaded yet.
        // The managers throw if queried before media is ready, hence the guard.
        function tracksOfType(type) {
            try {
                return tracksManagerOfType(type).getTracks() || [];
            } catch (e) {
                return [];
            }
        }

        // Active track ids for `type`, always an array (audio has at most one).
        function activeTrackIdsOfType(type) {
            try {
                if (type === 'AUDIO') {
                    const id = playerManager.getAudioTracksManager().getActiveId();
                    return (id === null || id === undefined) ? [] : [id];
                }
                return playerManager.getTextTracksManager().getActiveIds() || [];
            } catch (e) {
                return [];
            }
        }

        // Make `trackId` the active track of `type` (null to turn subtitles
        // off). The two managers are independent, so changing the audio track
        // never disturbs the active subtitle track or vice versa.
        function setActiveTrackOfType(type, trackId) {
            if (type === 'AUDIO') {
                if (trackId === null || trackId === undefined) return;
                playerManager.getAudioTracksManager().setActiveById(trackId);
            } else {
                const ids = (trackId === null || trackId === undefined)
                    ? [] : [trackId];
                playerManager.getTextTracksManager().setActiveByIds(ids);
            }
        }

        // Track Submenu (audio / subtitles)
        const LANG_NAMES = {
            'fr': 'Français', 'fra': 'Français', 'fre': 'Français',
            'en': 'English', 'eng': 'English',
            'de': 'Deutsch', 'deu': 'Deutsch', 'ger': 'Deutsch',
            'es': 'Español', 'spa': 'Español',
            'it': 'Italiano', 'ita': 'Italiano',
            'qaa': 'Original'
        };

        // ISO-639 tags the same language with 2- and 3-letter (and bibliographic vs
        // terminologic) variants; fold them so an API preference of 'fr' matches a
        // track tagged 'fra'/'fre' and vice versa.
        const LANG_ALIASES = {
            'fr': 'fr', 'fra': 'fr', 'fre': 'fr',
            'en': 'en', 'eng': 'en',
            'de': 'de', 'deu': 'de', 'ger': 'de',
            'es': 'es', 'spa': 'es',
            'it': 'it', 'ita': 'it'
        };
        function canonicalLang(code) {
            if (!code) return code;
            const c = code.toLowerCase();
            return LANG_ALIASES[c] || c;
        }

        function trackLabel(track, index) {
            if (track.language) {
                return LANG_NAMES[track.language] || track.language.toUpperCase();
            }
            return track.name || 'Piste ' + (index + 1);
        }

        // Open the submenu for the given track type ('AUDIO' or 'TEXT'). Text
        // tracks also get an "Off" entry. Returns false without opening when
        // there is no track of that type to choose from.
        function showTrackMenu(type) {
            const typeTracks = tracksOfType(type);
            if (typeTracks.length === 0) return false;

            const activeIds = activeTrackIdsOfType(type);

            trackMenuType = type;
            trackSelectedIndex = 0;
            trackOptions = [];
            // Subtitles can be turned off; audio always plays one track.
            if (type === 'TEXT') trackOptions.push({ trackId: null, label: 'Désactivés' });
            typeTracks.forEach((track, index) => {
                trackOptions.push({
                    trackId: track.trackId,
                    label: trackLabel(track, index),
                    language: track.language || null
                });
            });

            const anyActive = typeTracks.some(t => activeIds.includes(t.trackId));
            trackSubmenu.innerHTML = '';
            trackOptions.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'track-option';
                div.textContent = option.label;

                const isActive = (option.trackId === null)
                    ? !anyActive
                    : activeIds.includes(option.trackId);
                if (isActive) {
                    div.classList.add('active');
                    trackSelectedIndex = index;
                }

                trackSubmenu.appendChild(div);
            });

            trackMenuVisible = true;
            trackSubmenu.classList.add('visible');
            updateTrackSelection();
            // Arm the idle auto-hide for the submenu too, so it does not sit on
            // screen indefinitely when left open.
            resetHideMenuTimer();
            return true;
        }

        function hideTrackMenu() {
            trackMenuVisible = false;
            trackSubmenu.classList.remove('visible');
            // Back on the main menu, so restart its idle auto-hide countdown.
            resetHideMenuTimer();
        }

        function navigateTrackMenu(direction) {
            resetHideMenuTimer();
            trackSelectedIndex += direction;
            if (trackSelectedIndex < 0) trackSelectedIndex = trackOptions.length - 1;
            if (trackSelectedIndex >= trackOptions.length) trackSelectedIndex = 0;
            updateTrackSelection();
        }

        function updateTrackSelection() {
            const options = trackSubmenu.querySelectorAll('.track-option');
            options.forEach((opt, index) => {
                opt.classList.toggle('selected', index === trackSelectedIndex);
            });
        }

        function selectTrack() {
            const option = trackOptions[trackSelectedIndex];
            if (option) {
                setActiveTrackOfType(trackMenuType, option.trackId);
                if (trackMenuType === 'AUDIO') {
                    userSelectedAudio = true;
                    userAudioLanguage = option.language;
                    userAudioTrackId = option.trackId;
                } else {
                    userSelectedText = true;
                    userTextLanguage = option.language;
                    userTextTrackId = option.trackId;
                }
                console.log('[Etincelle] ' + trackMenuType
                    + ' track changed to:', option.trackId);
            }
            hideTrackMenu();
            setTimeout(hideMenu, 500);
        }

        // <ad-rule>
        // Skipping ad breaks. The rules are those of the etincelle apps (their BreakGuess and AdBreaks),
        // with times in seconds: what a stream marks of its breaks is read from its manifest; what it
        // does not is guessed, from the logo that sits in a corner of the picture through the programme
        // and is gone during the adverts (the channel's, in an upper corner, first; a picture with a
        // show's own, lower down, is the programme's too), and in a recording from its captions too
        // (a programme speaks for minutes, an advert for seconds). All of it is offered with a pill,
        // never skipped unasked.
        const AdRule = (() => {
            // A break lasts between these: under, it is a pause or a scene without a word; over, the
            // end of one programme and the start of another, a programme without captions being as
            // silent as adverts. Without the logo, as programmes show it, a break can last up to
            // LOGO_MAX_S: adverts and trailers fill eighteen and a half minutes between M6's evening
            // news and its sitcom.
            const MIN_S = 150;
            const MAX_S = 800;
            const LOGO_MAX_S = 1200;
            // A run of captions this long is programme; a run holds silences of up to CAPTION_GAP segments.
            const PROGRAMME_S = 60;
            const CAPTION_GAP = 3;
            // What two guesses of a break must share to be the same one, and how far apart their edges
            // may be for the logo's, the sharper, to be taken.
            const SHARED_S = 60;
            const EDGE_S = 90;
            // The share of its usual score under which a picture is without the logo, the pictures
            // either side it is smoothed with, the fewest without it that count (fewer are a bright
            // scene or a badge over it), the pictures with it a break may hold, and the pictures wanted
            // on each side with how many of them at least must have it.
            const GONE = 0.5;
            const SMOOTH = 2;
            const SOLID = 5;
            const BRIDGE = 7;
            const AROUND = 15;
            const MOSTLY = 8;
            // The pictures a piece at either end of a break must last to stay part of it when only
            // the bridge holds it there.
            const END_PIECE = 10;
            // Of the AROUND pictures on each side of a stretch without the show's logo, how many at
            // least must have the channel's for it to be a break the channel's alone did not give, and
            // the share of the stretch that must be without the channel's too.
            const CLEAR = 12;
            const SHOW_LED = 0.5;
            // The most pictures in a row the second logo may show in a break, the channel's being gone
            // with it, for them to be a trailer or a sponsor that carries it (Paris Première's
            // pictogram) rather than the programme; and the most the channel's may be seen, the second
            // gone the while, for them to be an advert with its brand in that corner (M6's faint logo).
            const SHORT_SHOW = 10;
            const BRAND = 12;
            // The share of a picture a corner takes, of a corner's points that are the logo, the least
            // a logo's edges must stand out, and those of a show's own beside the channel's: a fainter
            // one, as a band of text along the bottom, is matched by the notices along the bottom of
            // adverts, which then pass for the programme and part the break.
            const CORNER = 0.22;
            const MASK = 0.92;
            const STRONG = 25;
            const BESIDE = 30;
            // How many of the corners, the first ones, are the upper ones.
            const UPPER = 2;
            // Marked breaks this close are one; and the shape of a break on a stream that marks
            // nothing but cuts itself at each one: a jingle between two stretches of adverts, of one
            // to seven minutes (just over six in BFMTV's long breaks at night).
            const MERGE_GAP_S = 10;
            const JINGLE_MAX_S = 10;
            const HALF_MIN_S = 60;
            const HALF_MAX_S = 420;

            // The runs of true in flags, each as [first, last], holding up to bridge false in a row.
            function runs(flags, bridge) {
                const out = [];
                let i = 0;
                while (i < flags.length) {
                    if (!flags[i]) {
                        i++;
                        continue;
                    }
                    let last = i;
                    let j = i + 1;
                    while (j < flags.length && j - last <= bridge + 1) {
                        if (flags[j]) last = j;
                        j++;
                    }
                    out.push([i, last]);
                    i = last + 1;
                }
                return out;
            }

            // The breaks the captions give away; null when the programme has too few to tell.
            function captionBreaks(spoken, first, seg) {
                let said = 0;
                for (const s of spoken) if (s) said++;
                if (!(seg > 0) || said * 2 < spoken.length) return null;
                const programme = runs(spoken, CAPTION_GAP).filter(r => (r[1] - r[0] + 1) * seg >= PROGRAMME_S);
                const out = [];
                for (let k = 0; k + 1 < programme.length; k++) {
                    const before = programme[k];
                    const after = programme[k + 1];
                    const start = first + (before[1] + 1) * seg;
                    const end = first + after[0] * seg;
                    let inside = 0;
                    for (let i = before[1] + 1; i < after[0]; i++) if (spoken[i]) inside++;
                    if (end - start >= MIN_S && end - start <= MAX_S && inside * 2 < after[0] - before[1] - 1) out.push([start, end]);
                }
                return out;
            }

            // Of each picture, whether it is without the logo. One not given has it, and is no neighbour.
            function gone(score, usual, given) {
                const out = new Array(score.length).fill(false);
                for (let i = 0; i < score.length; i++) {
                    if (!given[i]) continue;
                    const near = [];
                    for (let j = Math.max(0, i - SMOOTH); j <= Math.min(score.length - 1, i + SMOOTH); j++) {
                        if (given[j]) near.push(score[j]);
                    }
                    near.sort((a, b) => a - b);
                    out[i] = near[near.length >> 1] < GONE * usual;
                }
                return out;
            }

            // gone without its strays.
            function solid(flags) {
                const out = new Array(flags.length).fill(false);
                for (const r of runs(flags, 0)) {
                    if (r[1] - r[0] + 1 >= SOLID) for (let i = r[0]; i <= r[1]; i++) out[i] = true;
                }
                return out;
            }

            // The stretches without the logo that have the programme on both sides and last what a
            // break does, as [first, last] pictures: held together by the bridge, and by a trailer or
            // a brand (see logoBreaks) where those are given.
            function breakRuns(flags, step, trailer, brand, lengthen) {
                const firm = solid(flags);
                const programme = (from, to) => {
                    if (from < 0 || to > firm.length) return false;
                    let with_ = 0;
                    for (let i = from; i < to; i++) if (!firm[i]) with_++;
                    return with_ >= MOSTLY;
                };
                const isBreak = r => {
                    const length = (r[1] + 1 - r[0]) * step;
                    return programme(r[0] - AROUND, r[0]) && programme(r[1] + 1, r[1] + 1 + AROUND) && length >= MIN_S && length <= LOGO_MAX_S;
                };
                const held = runs(firm, BRIDGE);
                if (!trailer || !brand) return held.filter(isBreak);
                // No short part to lengthen one with: it is never a break by itself either.
                const joinable = lengthen ? held.filter(r => r[1] - r[0] + 1 >= END_PIECE) : held;
                // Parts joined that are no break together are taken each by itself, as are those none of
                // which is a break by itself where a join is only to lengthen one.
                const out = [];
                for (const r of joined(joinable, trailer, brand, step)) {
                    const parts = joinable.filter(p => p[0] >= r[0] && p[1] <= r[1]);
                    if (isBreak(r) && (!lengthen || parts.length === 1 || parts.some(isBreak))) out.push(r);
                    else for (const p of parts) if (isBreak(p)) out.push([p[0], p[1]]);
                }
                return out;
            }

            // held with those parted only by a trailer or a brand, with up to BRIDGE other pictures,
            // made one, unless that one would be longer than a break may be.
            function joined(held, trailer, brand, step) {
                const out = [];
                for (const r of held) {
                    const last = out[out.length - 1];
                    if (last && (r[1] + 1 - last[0]) * step <= LOGO_MAX_S && partedBy(last[1] + 1, r[0], trailer, brand)) last[1] = r[1];
                    else out.push([r[0], r[1]]);
                }
                return out;
            }

            // Whether the pictures from from below to hold a trailer or a brand, with up to BRIDGE
            // other pictures, and no more of either.
            function partedBy(from, to, trailer, brand) {
                let known = 0;
                for (let i = from; i < to; i++) if (trailer[i] || brand[i]) known++;
                return to - from <= SHORT_SHOW + BRAND + BRIDGE && known >= to - from - BRIDGE &&
                    longest(trailer, from, to) <= SHORT_SHOW && longest(brand, from, to) <= BRAND;
            }

            // The most flags in a row from from below to.
            function longest(flags, from, to) {
                let row = 0;
                let most = 0;
                for (let i = from; i < to; i++) {
                    row = flags[i] ? row + 1 : 0;
                    most = Math.max(most, row);
                }
                return most;
            }

            // Those stretches as [start, end]. With a second logo, lowerFlags tells of each picture
            // whether it is without that one: a break is then what is left of one once the pictures
            // that show the second logo are taken for the programme's. The second logo shown at most
            // SHORT_SHOW pictures in a row, the first gone the while (a trailer that carries the
            // channel's pictogram), does not part two pieces of a break; nor does the first seen at
            // most BRAND pictures in a row, the second gone the while (an advert with its brand in the
            // first one's corner), and that from the first look on where another part is a break by
            // itself and it is no shorter than an end piece (a new programme whose show's logo is not

        // - isLive(), joining(): whether the stream is live, and still joining its live point;
        // - state(): 'playing', 'paused' or anything else;
        // - currentTime(), liveRange(): where playback is and the live window ({start, end}), in media
        //   time (s); absoluteTime(media) and mediaTime(absolute) convert to and from seconds since 1970;
        // - show(on): offers the skip or takes it back, and says whether it is offered;
        // - seek(media): goes there.
        function makeAdSkip(env) {

            // A live channel's pictures come one every four seconds, by their time since 1970.
            const STEP_S = 4;
            const NOT_YET_S = 12;
            const BEHIND_S = 60;
            const LIVE_MARGIN_S = 2;
            const LAST_MOMENT_S = 1;
            // A guessed break is taken to end this long before the logo is back: channels put their
            // logo up again as much as half a minute after the programme, and skipping to it would
            // cut that much of the show. The last adverts are left in instead.
            const GUESS_EARLY_S = 32;
            // The logo is learnt from a picture every LEARN_EVERY_S, this far on each side of the
            // playhead, again once the playhead is LEARN_AGAIN_S from there, or LEARN_RETRY_S when
            // nothing was learnt.
            const LEARN_SPAN_S = 1200;
            const LEARN_EVERY_S = 28;
            const LEARN_AGAIN_S = 900;
            const LEARN_RETRY_S = 120;
            // Where no logo stands out, the channel's last one is taken when seen on this share of the
            // pictures; with none, it is looked for this many times forty minutes back, once.
            const KEPT_SEEN = 0.4;
            const EARLIER_TIMES = 3;
            // Read around the playhead at all times, and more at a time while a stretch without the
            // logo goes on, for as far as a break may; older pictures are forgotten.
            const BACK_S = 64;
            const AHEAD_S = 88;
            const MORE_S = 120;
            const MORE_TIMES = 4;
            const FAR_S = AdRule.LOGO_MAX_S + 160;
            // Older pictures are forgotten, no nearer than a read back may reach, or they would be
            // read again at each look.
            const KEPT_S = FAR_S + MORE_S;
            const TRIES = 3;
            // A channel's blacks between adverts (see AdRule.separatorEnds) are read from the first
            // bytes of each segment, this far on each side of the playhead: further than a break lasts,
            // so that one the playhead is in is known from end to end. The last segments are not
            // there yet.
            const HEAD_BYTES = 8192;
            const SEPARATED_FAR_S = 480;
            const SEGMENT_NOT_YET_S = 8;
            const MARKED_EVERY_MS = 30000;
            const LOOK_EVERY_MS = 4000;
            // A recording has no more strips of thumbnails, nor caption segments.
            const MAX_STRIPS = 150;
            const MAX_SEGMENTS = 10000;
            // A recording that could not be read is searched again after this long while it plays.
            const RECORDING_RETRY_MS = 5 * 60 * 1000;
            // What is asked of the network and does not come is given up on after this long.
            const TIMEOUT_MS = 20000;
            // Pictures are read at half their size, which the logo survives.
            const PICTURE_WIDTH = 240;
            const PICTURE_HEIGHT = 135;

            // What is being played; a search that outlives it finds itself out of date by its number.
            let playing = 0;
            let key = null;
            let live = false;
            let manifestUrl = null;
            let thumbnailsUrl = null;
            // A recording's breaks, as [start, end] in its own time; the search's outcome for the status;
            // and the search still to be made, once the recording plays.
            let recorded = [];
            let recordedState = 'none';
            let wanted = null;
            // The searches of the recording loaded that failed, for each to wait twice as long as the one before.
            let recordingFails = 0;
            const known = new Map();
            // A live channel's: marked by its manifest and found by its logo, in seconds since 1970.
            let marked = [];
            let markedAt = 0;
            let markedState = 'none';
            let found = [];
            let logo = null;
            let logoState = 'none';
            let learntAt = -Infinity;
            // The learns in a row that found no logo.
            let failures = 0;
            // The channel's logo last found, by the address of its pictures, for a channel played again
            // while this page lives: what a learn over pictures mostly of adverts and trailers falls back
            // on; and the channel whose earlier pictures were last searched for it, once a stream.
            const remembered = new Map();
            let searchedFor = null;
            let scores = new Map();
            // The same of the show's own logo, when one was learnt beside the channel's.
            let lowerScores = new Map();
            let missed = new Map();
            // The stream a look is under way for; 0 when none is.
            let looking = 0;
            let lookedAt = 0;
            // Where the skip on offer leads, in media time; null when none is. And whether it is shown.
            let offered = null;
            let shown = false;
            let canvas = null;
            // The blacks between adverts, on a channel that has them as the sender says
            // (separated_breaks): the live video segments the manifest last listed, the blacks found in
            // each segment read by its key (its rendition's height and its time) with its time (s since
            // 1970), those that could not be read with how many times, and the breaks they make.
            let separating = false;
            let separatorsState = 'none';
            let videoSegments = [];
            let blacks = new Map();
            let blackMisses = new Map();
            let separated = [];

            function pathOf(url) {
                const q = String(url).indexOf('?');
                return q < 0 ? String(url) : String(url).slice(0, q);
            }

            // A stream was loaded: what was known of another is dropped, and a recording is searched.
            function load(media, customData) {
                try {
                    const url = media && media.contentId;
                    const nowLive = !!env.isLive();
                    const newKey = url ? pathOf(url) : null;
                    manifestUrl = url || null;
                    const thumbs = customData && customData.live_thumbnails_url;
                    thumbnailsUrl = (nowLive && typeof thumbs === 'string' && thumbs.indexOf('https://') === 0) ? thumbs.replace(/\/+$/, '') : null;
                    separating = nowLive && !!(customData && customData.separated_breaks === true);
                    // Only what the sender says is a recording is searched: a replay has no adverts.
                    const record = !nowLive && !!(customData && customData.recording) && newKey !== null;
                    // The same stream loaded again, as after a break in the connection: all is kept,
                    // but a search that failed is made again.
                    if (newKey !== null && newKey === key && nowLive === live) {
                        if (record && /^error/.test(recordedState)) wanted = { url: manifestUrl, name: key, mine: playing };
                        return;
                    }
                    playing++;
                    key = newKey;
                    live = nowLive;
                    offered = null;
                    shown = env.show(false);
                    recorded = [];
                    recordedState = record ? 'waiting' : 'none';
                    marked = [];
                    markedAt = 0;
                    markedState = 'none';
                    found = [];
                    logo = null;
                    logoState = 'none';
                    learntAt = -Infinity;
                    failures = 0;
                    searchedFor = null;
                    scores = new Map();
                    lowerScores = new Map();
                    missed = new Map();
                    separatorsState = separating ? 'waiting' : 'none';
                    videoSegments = [];
                    blacks = new Map();
                    blackMisses = new Map();
                    separated = [];
                    // Once it plays (see tick): its start is not to be slowed by the search.
                    wanted = record ? { url: manifestUrl, name: key, mine: playing } : null;
                    recordingFails = 0;
                } catch (e) {
                    recordedState = 'error';
                }
            }

            // Runs work on each item, atOnce at a time; resolves with what each gave, in order.
            function each(items, atOnce, work) {
                const out = new Array(items.length);
                let next = 0;
                const worker = async () => {
                    while (next < items.length) {
                        const i = next++;
                        out[i] = await work(items[i], i);
                    }
                };
                const workers = [];
                for (let w = 0; w < Math.min(atOnce, items.length); w++) workers.push(worker());
                return Promise.all(workers).then(() => out);
            }

            async function text(url) {
                const abort = new AbortController();
                const timer = setTimeout(() => abort.abort(), TIMEOUT_MS);
                try {
                    const response = await fetch(url, { credentials: 'omit', signal: abort.signal });
                    if (!response.ok) throw new Error('http ' + response.status);
                    return await response.text();
                } finally {
                    clearTimeout(timer);
                }
            }

            // The image at url drawn width by height, as its pixels (RGBA); null when it cannot be had.
            function pixels(url, width, height) {
                return new Promise(resolve => {
                    const image = new Image();
                    const timer = setTimeout(() => {
                        image.onload = null;
                        image.onerror = null;
                        resolve(null);
                    }, TIMEOUT_MS);
                    image.crossOrigin = 'anonymous';
                    image.onload = () => {
                        clearTimeout(timer);
                        try {
                            if (canvas === null) canvas = document.createElement('canvas');
                            if (canvas.width !== width || canvas.height !== height) {
                                canvas.width = width;
                                canvas.height = height;
                            }
                            const context2d = canvas.getContext('2d', { willReadFrequently: true });
                            context2d.drawImage(image, 0, 0, width, height);
                            resolve(context2d.getImageData(0, 0, width, height).data);
                        } catch (e) {
                            resolve(null);
                        }
                    };
                    image.onerror = () => {
                        clearTimeout(timer);
                        resolve(null);
                    };
                    image.src = url;
                });
            }

            // The luma of the picture at left of a row of pixels rowWidth wide.
            function lumaOf(data, rowWidth, left) {
                const out = new Uint8Array(PICTURE_WIDTH * PICTURE_HEIGHT);
                let o = 0;
                for (let y = 0; y < PICTURE_HEIGHT; y++) {
                    let p = (y * rowWidth + left) * 4;
                    for (let x = 0; x < PICTURE_WIDTH; x++) {
                        out[o++] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
                        p += 4;
                    }
                }
                return out;
            }

            function seconds(duration) {
                const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:([\d.]+)S)?$/.exec(duration || '');
                return m ? (Number(m[1] || 0) * 3600 + Number(m[2] || 0) * 60 + Number(m[3] || 0)) : NaN;
            }

            function children(node, name) {
                const out = [];
                for (let c = node.firstElementChild; c; c = c.nextElementSibling) if (c.localName === name) out.push(c);
                return out;
            }

            function baseOf(node, base) {
                const own = children(node, 'BaseURL')[0];
                return own && own.textContent ? new URL(own.textContent.trim(), base).href : base;
            }

            // The segments of an adaptation set of a recording total seconds long, as {time, duration,
            // url}; empty when they cannot be told.
            function segmentsOf(set, base, total, chosen) {
                const representation = chosen || children(set, 'Representation')[0];
                if (!representation) return [];
                const template = children(set, 'SegmentTemplate')[0] || children(representation, 'SegmentTemplate')[0];
                const media = template && template.getAttribute('media');
                if (!media) return [];
                const scale = Number(template.getAttribute('timescale') || 1);
                const offset = Number(template.getAttribute('presentationTimeOffset') || 0);
                // $Time$ or $Number$, which may ask for a width, as $Number%05d$.
                const put = (template_, name, value) => template_.replace(new RegExp('\\$' + name + '(?:%0(\\d+)d)?\\$', 'g'),
                    (whole, width) => (width ? String(value).padStart(Number(width), '0') : String(value)));
                const address = (time, number) => new URL(
                    put(put(media.split('$RepresentationID$').join(representation.getAttribute('id')), 'Time', time), 'Number', number), base).href;
                const out = [];
                const timeline = children(template, 'SegmentTimeline')[0];
                if (timeline) {
                    let time = 0;
                    let number = Number(template.getAttribute('startNumber') || 1);
                    const entries = children(timeline, 'S');
                    for (let e = 0; e < entries.length; e++) {
                        const s = entries[e];
                        if (s.getAttribute('t') !== null) time = Number(s.getAttribute('t'));
                        const length = Number(s.getAttribute('d'));
                        let repeat = Number(s.getAttribute('r') || 0);
                        if (!(length > 0)) return [];
                        if (repeat < 0) {
                            // Repeated to the next entry, or to the end of the recording.
                            const next = e + 1 < entries.length ? entries[e + 1].getAttribute('t') : null;
                            const until = next !== null ? Number(next) : total * scale + offset;
                            repeat = Math.ceil((until - time) / length) - 1;
                        }
                        if (!(repeat >= 0)) return [];
                        for (let k = 0; k <= repeat; k++) {
                            out.push({ time: (time - offset) / scale, duration: length / scale, url: address(time, number) });
                            time += length;
                            number++;
                            if (out.length > MAX_SEGMENTS) return [];
                        }
                    }
                    return out;
                }
                // Numbered: the first may begin before the recording does, by what the manifest says
                // (eptDelta), or by its number and the track's offset.
                const length = Number(template.getAttribute('duration')) / scale;
                const first = Number(template.getAttribute('startNumber') || 1);
                if (!(length > 0)) return [];
                let early = 0;
                if (template.getAttribute('eptDelta') !== null) {
                    early = Number(template.getAttribute('eptDelta')) / scale;
                } else {
                    early = (first - 1) * length - offset / scale;
                }
                if (!(early < 0 && -early < length)) early = 0;
                const last = template.getAttribute('endNumber') !== null
                    ? Number(template.getAttribute('endNumber')) : first + Math.ceil((total - early) / length) - 1;
                if (!(last >= first) || last - first + 1 > MAX_SEGMENTS) return [];
                for (let n = first; n <= last; n++) {
                    out.push({ time: (n - first) * length + early, duration: length, url: address('', n) });
                }
                return out;
            }

            // The breaks the captions of a recording give away; null when they say nothing. Throws
            // when too many could not be read.
            async function captionsOf(segments, mine) {
                if (segments.length === 0) return null;
                const paragraph = /<p\b[^>]*>([\s\S]*?)<\/p>/g;
                let unread = 0;
                const spoken = await each(segments, 4, async segment => {
                    // Another stream was loaded meanwhile: nothing more is asked for this one.
                    if (mine !== playing) return true;
                    try {
                        // Asked twice: one that fails for a moment would have the whole search made again.
                        const body = await text(segment.url).catch(() => text(segment.url));
                        let m;
                        paragraph.lastIndex = 0;
                        while ((m = paragraph.exec(body)) !== null) {
                            if (m[1].replace(/<[^>]+>/g, '').trim() !== '') return true;
                        }
                        return false;
                    } catch (e) {
                        unread++;
                        // One that could not be read counts as spoken: it can hide a break, not make one.
                        return true;
                    }
                });
                if (mine !== playing) throw new Error('superseded');
                if (unread * 20 > spoken.length) throw new Error('captions unread');
                return AdRule.captionBreaks(spoken, segments[0].time, segments[0].duration);
            }

            // The breaks the logo of a recording gives away, from its strips of across by down
            // thumbnails; null when it has none. Throws when a strip wanted could not be read.
            async function logoOf(strips, across, down, mine) {
                // A strip is a single row of pictures on this service; another layout is left alone.
                if (strips.length === 0 || strips.length > MAX_STRIPS || down !== 1 || !(across > 0)) return null;
                const perStrip = across;
                const track = AdRule.track(strips.length * perStrip, PICTURE_WIDTH, PICTURE_HEIGHT);
                const give = async wanted => {
                    const read = await each(wanted, 1, async i => {
                        if (mine !== playing) return false;
                        // Asked twice, as the captions.
                        let data = await pixels(strips[i].url, across * PICTURE_WIDTH, PICTURE_HEIGHT);
                        if (data === null && mine === playing) data = await pixels(strips[i].url, across * PICTURE_WIDTH, PICTURE_HEIGHT);
                        if (data === null) return false;
                        for (let k = 0; k < perStrip; k++) {
                            track.add(i * perStrip + k, lumaOf(data, across * PICTURE_WIDTH, k * PICTURE_WIDTH));
                        }
                        return true;
                    });
                    return read.every(ok => ok);
                };
                const indices = strips.map((s, i) => i);
                // Every other strip first, then those next to one with the logo gone.
